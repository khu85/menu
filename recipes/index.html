:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto;text-transform:uppercase}
.homebtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 24px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:24px;text-decoration:none;text-transform:uppercase}
main{padding:24px 28px 72px;max-width:1000px;margin:0 auto}
section{margin-top:28px}
section:first-child{margin-top:0}
main h2{background:var(--ink);color:var(--beige);border-radius:2px;padding:10px 18px;font-size:28px;margin:0 0 14px;letter-spacing:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:108px;padding:12px 16px;border-radius:2px;background:var(--ink);color:var(--beige);text-decoration:none;text-align:center}
.tile .tn{font-size:28px;line-height:1.15}
.tile .tt{font-size:20px}
.tile:active{background:var(--brand)}
.recipe{max-width:900px;margin:0 auto}
.recipe h1{background:var(--ink);color:var(--beige);border-radius:2px;padding:14px 20px;font-size:40px;line-height:1.1;margin:0 0 10px;text-align:center}
.yield{background:var(--brand);color:var(--beige);border-radius:2px;padding:12px 20px;font-size:30px;text-align:center}

/* red notification badges on the page links: low stock items, and events in the next 7 days that are not paid */
(function(){
 var STOCK_API="https://script.google.com/macros/s/AKfycbwD87ttdlNAqROnHrWgwhuJUxsB43yG55RJUuLiObC6Uet0E3jCI727FF25FP2odyFs/exec";
 function setBadge(pg,n,what){d.querySelectorAll('[data-pg="'+pg+'"]').forEach(function(a){
  var e=a.querySelector(".nbd");
  if(!n){if(e)e.remove();return}
  if(!e){e=d.createElement("i");e.className="nbd";a.appendChild(e)}
  e.textContent=n>99?"99+":String(n);e.setAttribute("aria-label",n+" "+what);e.title=n+" "+what})}
 function events(){
  if(site!=="owner")return;
  var list=[];try{list=JSON.parse(localStorage.getItem("kf-evlist"))||[]}catch(e){}
  var now=new Date(),pad=function(n){return(n<10?"0":"")+n},iso=function(t){return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
  var today=iso(now),lim=iso(new Date(now.getTime()+7*86400000));
  var n=list.filter(function(e){return e&&e.date&&e.date>=today&&e.date<=lim&&e.pay!=="paid"&&!/^s[1-4]$/.test(e.id||"")}).length;
  setBadge("events",n,n===1?"event needs attention":"events need attention")}
 function stock(n){setBadge("stock",n,n===1?"low stock item":"low stock items")}
 events();
 try{fetch(STOCK_API,{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  var low=((j&&j.current&&j.current.alerts)||[]).filter(function(a){return a.status==="active"}).length;stock(low)}).catch(function(){})}catch(e){}
 var lb=d.getElementById("lowbox");
 if(lb&&window.MutationObserver)new MutationObserver(function(){stock(d.querySelectorAll("#lowbox .orow.low").length)}).observe(lb,{childList:true,subtree:true});
 window.addEventListener("storage",events);
})();
})();
