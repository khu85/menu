:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto;text-transform:uppercase}
.homebtn{display:flex;align-items:center;gap:10px;min-height:56px;padding:0 24px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:24px;text-decoration:none;text-transform:uppercase}
main{padding:24px 28px 72px;max-width:1000px;margin:0 auto}
section{margin-top:28px}
section:first-child{margin-top:0}
main h2{background:var(--ink);color:var(--beige);border-radius:2px;padding:10px 18px;font-size:28px;margin:0 0 14px;letter-spacing:1px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;justify-content:center;gap:6px;min-height:108px;padding:12px 16px;border-radius:2px;background:var(--ink);color:var(--beige);text-decoration:none;text-align:center}
.tile .tn{font-size:28px;line-height:1.15}
.tile .tt{font-size:20px}
.tile:active{background:var(--brand)}
.recipe{max-width:900px;margin:0 auto}
.recipe h1{background:var(--ink);color:var(--beige);border-radius:2px;padding:14px 20px;font-size:40px;line-height:1.1;margin:0 0 10px;text-align:center}
.yield{background:var(--brand);color:var(--beige);border-radius:2px;padding:12px 20px;font-size:30px;text-align:center}

/* one row size and text size on every list */
html[data-page="home"] body.skin .kv{font-size:14px}
html[data-page="recipes"] body.skin .tile{min-height:48px!important;padding:8px 14px!important}
html[data-page="recipes"] body.skin .tile .tn{font-size:15px!important}
html[data-page="prep"] body.skin ul.list>li.row{padding-top:8px!important;padding-bottom:8px!important}
/* − buttons readable on beige; no grey bars (only status colours) */
html:not([data-page="home"]:not([data-site])) body.skin .stp:not(.plus),html[data-page="prep"] body.skin .ctl button:not(.plus){background:#fff!important;border:1px solid #d9d6c3!important;color:var(--ink)!important}
html:not([data-page="home"]:not([data-site])) body.skin ul.list>li:has(.nmbox):not(:has(.nmbox.ok,.nmbox.low,.nmbox.bad)){border-left:0!important;padding-left:14px!important}
/* owner stock: many tabs scroll in one row, square */
@media (max-width:760px){
 html[data-page="stock"][data-site="owner"] body.skin #nav{display:flex!important;overflow-x:auto;flex-wrap:nowrap!important;-webkit-overflow-scrolling:touch;margin:8px 0 6px!important;padding:0 14px!important}
 html[data-page="stock"][data-site="owner"] body.skin #nav .tab{flex:0 0 auto!important;white-space:nowrap;padding:0 14px!important}
}
/* events page title row lines up with the other pages */
html[data-page="events"] body.skin .titlebar,html[data-page="events"] body.skin .hello{align-items:flex-start}
html[data-page="prep"] body.skin .ctl button:not([data-act^="-"]){background:var(--brand)!important;border:0!important;color:#fff!important}

/* ---- bento cards: every section is a white card ---- */

html:not(#k):not(#j) body.skin main section section{background:none!important;padding:0!important;margin:0!important;border-radius:0!important}
html:not(#k):not(#j) body.skin :is(main section>h2,#view>section>h2){display:flex;justify-content:space-between;align-items:baseline;margin:0 0 14px!important;padding:0!important}
html:not(#k):not(#j) body.skin hr{display:none}
/* lists inside cards: flat rows with hairlines */
html:not(#k):not(#j) body.skin :is(.orlist,ul.list,ul.usage,ul.log){background:transparent!important;border:0!important;box-shadow:none!important;border-radius:0!important;padding:0!important;margin:0!important;display:block!important;gap:0!important}
html:not(#k):not(#j) body.skin :is(.orlist>.orow,ul.list>li,ul.usage>li,ul.log>li,section .orow){background:transparent!important;border:0!important;border-top:1px solid var(--sep)!important;border-radius:0!important;box-shadow:none!important;margin:0!important;padding-top:14px!important;padding-bottom:14px!important}
html:not(#k):not(#j) body.skin :is(.orlist>.orow,ul.usage>li,section .orow){padding-left:4px!important;padding-right:4px!important}
html:not(#k):not(#j) body.skin .colh{padding:0 4px 8px!important}
/* usage groups are not wrapped in sections: give each list its own card */
html:not(#k):not(#j) body.skin #view>ul.usage{background:var(--card)!important;border-radius:var(--rr)!important;padding:8px 20px!important;margin:0 0 14px!important}
html:not(#k):not(#j) body.skin #view>ul.usage>li:first-child{border-top:0!important}
html:not(#k):not(#j) body.skin #view>h3.h{margin:18px 4px 8px!important}
/* status: legend dots instead of edge lines */
html:not(#k):not(#j) body.skin :is(.orlist>.orow,ul.usage>li.row,section .orow) .on::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--sep);margin:0 10px 1px 0;vertical-align:middle}
html:not(#k):not(#j) body.skin :is(.orlist>.orow,ul.usage>li.lowc,.orow.ordn) .on::before{background:var(--gold)}
html:not(#k):not(#j) body.skin :is(.orow.ordn.od) .on::before{background:var(--red)}
html:not(#k):not(#j) body.skin .orow.ordn.od .st .sv:last-child b{color:var(--red)!important}
html:not(#k):not(#j) body.skin .nmbox{background:none!important;border:0!important;box-shadow:none!important;padding-left:0!important}
/* ---- tiles ---- */
html:not(#k):not(#j) body.skin :is(.kpi,.stat,.tile,.wxt){background:var(--card)!important;border:0!important;border-radius:var(--rr)!important;box-shadow:none!important;padding:20px 22px!important}
html:not(#k):not(#j) body.skin :is(.stats .stat){background:var(--fill)!important}
html:not(#k):not(#j) body.skin .kpi b,html:not(#k):not(#j) body.skin .stat .sv{font-size:32px!important;font-weight:400!important;letter-spacing:-.03em!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin :is(.kv,.kv.note,.alrow,.msg,.fl,p.sample,.tnote,.dt.hol){background:var(--fill)!important;border:0!important;border-radius:var(--rm)!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .tnote{background:var(--brand)!important;padding:16px 20px!important;border-radius:var(--rr)!important}
html:not(#k):not(#j) body.skin .tnote :is(b,p){color:#fff!important}
html:not(#k):not(#j) body.skin .tnote b{color:rgba(255,255,255,.7)!important}
html:not(#k):not(#j) body.skin .alrow.bad{background:#FBECEA!important}
html:not(#k):not(#j) body.skin .alrow.bad *{color:var(--red)!important}
/* ---- sidebar: icon tiles ---- */
html:not(#k):not(#j) body.skin .sb{background:transparent!important;border:0!important;box-shadow:none!important;-webkit-backdrop-filter:none;backdrop-filter:none}
html:not(#k):not(#j) body.skin .sb .sbl img{filter:none!important}
html:not(#k):not(#j) body.skin .sb a.sbi{width:46px;height:46px;min-height:46px;padding:0!important;justify-content:center;margin:0 auto 8px;color:var(--black)!important;background:var(--card)!important;border-radius:14px!important;transition:background .25s var(--ease),color .25s var(--ease),transform .2s var(--ease)}
html:not(#k):not(#j) body.skin .sb a.sbi:hover{transform:translateY(-1px)}
html:not(#k):not(#j) body.skin .sb a.sbi[aria-current="page"]{background:var(--black)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .sb a.sbi[aria-current="page"]::before{display:none!important}
html:not(#k):not(#j) body.skin :is(#top,header,.titlebar,.tabwrap){background:transparent!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
html:not(#k):not(#j) body.skin #sync{background:var(--card)!important;border:0!important;border-radius:14px!important;box-shadow:none!important;color:var(--ink)!important;font-weight:400!important}
/* ---- segmented controls (track + brand pill) ---- */
html:not(#k):not(#j) body.skin .titlebar #nav{background:var(--card)!important;padding:5px!important;border-radius:18px!important;gap:4px!important;border:0!important}
html:not(#k):not(#j) body.skin .titlebar #nav .tab{background:transparent!important;border:0!important;border-radius:13px!important;color:var(--mute)!important;box-shadow:none!important;font-weight:500!important;font-size:13px!important;transition:background .3s var(--ease),color .3s var(--ease)}
html:not(#k):not(#j) body.skin .titlebar #nav .tab .sh{font-size:13px!important;font-weight:500!important;letter-spacing:0!important}
html:not(#k):not(#j) body.skin .titlebar #nav .tab:hover{color:var(--ink)!important;background:var(--fill)!important}
html:not(#k):not(#j) body.skin .titlebar #nav .tab[aria-selected="true"]{background:var(--brand)!important;color:#fff!important}
html:not(#k):not(#j) body.skin :is(.seg,#secs,.fcs){background:var(--card)!important;padding:4px!important;border-radius:14px!important;gap:2px!important;display:inline-flex!important;border:0!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin :is(.seg,#secs)[hidden]{display:none!important}
html:not(#k):not(#j) body.skin section :is(.seg,.fcs){background:var(--fill)!important}
html:not(#k):not(#j) body.skin :is(.seg button,#secs button,.sec,.fcs button,#fcbar button){background:transparent!important;border:0!important;border-radius:10px!important;color:var(--ink)!important;font-weight:400!important;font-size:14px!important;min-height:36px;padding:0 16px!important;box-shadow:none!important;transition:background .25s var(--ease),color .25s var(--ease)}
html:not(#k):not(#j) body.skin :is(.seg button,#secs button,.sec,.fcs button,#fcbar button)[aria-pressed="true"],html:not(#k):not(#j) body.skin :is(.sec.on,#secs button.on){background:var(--brand)!important;color:#fff!important}
/* ---- buttons ---- */
html:not(#k):not(#j) body.skin :is(button.big,.big){border-radius:var(--rm)!important;font-weight:500!important;letter-spacing:0!important;font-size:14px!important;transition:transform .2s var(--ease),background .2s var(--ease)!important}
html:not(#k):not(#j) body.skin :is(button.big.light,.big.light){background:var(--card)!important;border:0!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin section :is(button.big.light,.big.light){background:var(--fill)!important}
html:not(#k):not(#j) body.skin :is(button.big.light,.big.light):hover{background:#E9E8E3!important}
html:not(#k):not(#j) body.skin :is(button.big.green,.big.green){background:var(--black)!important;border:0!important;color:#fff!important}
html:not(#k):not(#j) body.skin :is(button.big.green,.big.green):hover{background:#1f1e1f!important}
html:not(#k):not(#j) body.skin :is(button.big,.stp,.seg button,.sec,.sb a.sbi):active{transform:scale(.97)}
html:not(#k):not(#j) body.skin :is(:is(li.row,.orow.kfa) .step,.ctl){border-radius:12px!important;overflow:hidden;border:0!important;background:var(--fill)!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin :is(:is(li.row,.orow.kfa) .step,.ctl) :is(.stp,.cin,input,button,.ct){background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin :is(:is(li.row,.orow.kfa) .step .stp.plus,.ctl button:last-child){background:var(--brand)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .orow.ordn .xbtn{border:0!important;background:var(--fill)!important;border-radius:10px!important}
/* inputs */
html:not(#k):not(#j) body.skin :is(input,textarea,select):not([type=checkbox]):not([type=radio]){border:0!important;background:var(--card)!important;border-radius:var(--rm)!important;transition:box-shadow .2s var(--ease)}
html:not(#k):not(#j) body.skin section :is(input,textarea,select):not([type=checkbox]):not([type=radio]){background:var(--fill)!important}
html:not(#k):not(#j) body.skin :is(:is(li.row,.orow.kfa) .step,.ctl) input{background:transparent!important}
html:not(#k):not(#j) body.skin :is(input,textarea,select):focus{box-shadow:0 0 0 2px var(--brand)!important;outline:none}
html:not(#k):not(#j) body.skin :focus-visible{outline:2px solid var(--brand)!important;outline-offset:2px}
/* floating confirm bar + sheet */
html:not(#k):not(#j) body.skin #bar{background:var(--black)!important;border:0!important;box-shadow:0 20px 40px -16px rgba(0,0,0,.45)!important;border-radius:20px!important;color:#fff!important}
html:not(#k):not(#j) body.skin #bar .bi{color:rgba(255,255,255,.75)!important}
html:not(#k):not(#j) body.skin #bar .big{background:var(--brand)!important;color:#fff!important;border:0!important}
html:not(#k):not(#j) body.skin #bar .big:disabled{background:#4a4849!important;color:rgba(255,255,255,.5)!important}
html:not(#k):not(#j) body.skin .cfmbox{border-radius:28px!important;box-shadow:0 30px 80px -20px rgba(0,0,0,.35)!important;border:0!important}
html:not(#k):not(#j) body.skin .cfmb{border-radius:var(--rm)!important}
@media (min-width:761px){
html:not(#k):not(#j) body.skin #bar{left:calc(var(--sbw,72px) + 24px)!important;right:24px!important;bottom:16px!important;width:auto!important}
}
@media (max-width:760px){
html:not(#k):not(#j) body.skin main section,html:not(#k):not(#j) body.skin #view>section,html:not(#k):not(#j) body.skin .card{border-radius:20px!important;padding:18px!important}
html:not(#k):not(#j) body.skin #bar{left:10px!important;right:10px!important;border-radius:18px!important}
html:not(#k):not(#j) body.skin :is(.bnav,html[data-page="stock"] #nav){border-top:0!important}
html:not(#k):not(#j) body.skin :is(.bnav a[aria-current="page"],.bnav .on){border-radius:12px!important}
}
/* motion */
@keyframes kfrise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
html:not(#k):not(#j) body.skin main>*,html:not(#k):not(#j) body.skin #view>*{animation:kfrise .55s var(--ease) backwards}
html:not(#k):not(#j) body.skin #lowbox{animation:none!important}
@media (prefers-reduced-motion:reduce){html:not(#k):not(#j) body.skin *{animation:none!important;transition:none!important}}
html:not(#k):not(#j) body.skin .annrow button{border-radius:var(--rm)!important;border:0!important;background:var(--fill)!important;color:var(--ink)!important;font-weight:500!important;height:42px!important}
html:not(#k):not(#j) body.skin .annrow #annpost{background:var(--black)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .mnav button{border-radius:12px!important;border:0!important;background:var(--card)!important;width:40px;height:40px}
html:not(#k):not(#j) body.skin .alertsum .alrow{margin-bottom:10px}
html:not(#k):not(#j) body.skin p.sample{padding:12px 16px!important;background:var(--card)!important}
html:not(#k):not(#j) body.skin .tnote.tnote{background:var(--brand)!important}
html:not(#k):not(#j) body.skin :is(main,#view,header,.titlebar) button:not(.stp):not(.tab):not(.step):not(.tm>button){border-radius:12px!important}
html:not(#k):not(#j) body.skin :is(:is(li.row,.orow.kfa) .step,.ctl) :is(button,.stp){border-radius:0!important}
html:not(#k):not(#j) body.skin .dt.hol{background:var(--card)!important;color:var(--ink)!important}
@media (max-width:760px){
html:not(#k):not(#j)[data-page="stock"] body.skin #nav:not(.x){border-radius:20px!important;padding:5px!important;gap:4px!important;border:0!important;overflow:hidden}
html:not(#k):not(#j)[data-page="stock"] body.skin #top #nav .tab,html:not(#k):not(#j)[data-page="stock"] body.skin #nav .tab{border-radius:14px!important}
html:not(#k):not(#j) body.skin :is(.bnav,#nav) :is(a,.tab,.pglnk)::after{border-radius:12px!important}
html:not(#k):not(#j) body.skin :is(.bnav) a{border-radius:12px!important}
}
html:not(#k):not(#j) body.skin #today>*{width:auto!important;max-width:100%!important;box-sizing:border-box}
html:not(#k):not(#j) body.skin #today .fcs{max-width:100%;overflow-x:auto}
html:not(#k):not(#j) body.skin section{position:relative}
html:not(#k):not(#j) body.skin section>a.go,html:not(#k):not(#j) body.skin section>.go{position:absolute!important;top:16px!important;right:18px!important;border-radius:12px!important;background:var(--black)!important}
html:not(#k):not(#j) body.skin :is(#today .fcs,.fcs){display:flex!important;width:100%}
html:not(#k):not(#j) body.skin :is(#today .fcs button,.fcs button){flex:1 1 0;padding:0 4px!important;min-width:0}

html:not(#k):not(#j) body.skin section ul:not([class])>li:is(.more,.low){background:transparent!important;border-top:1px solid var(--sep)!important;border-right:0!important;border-bottom:0!important;border-left-width:3px!important;border-radius:0!important;box-shadow:none!important;margin:0!important;padding-left:14px!important}
html:not(#k):not(#j) body.skin section ul:not([class])>li:first-child{border-top:0!important}
html:not(#k):not(#j) body.skin ul.list>li:is(.low,.more){padding-left:inherit}
html:not(#k):not(#j) body.skin #view>.colh{padding:0 24px 8px!important}
html:not(#k):not(#j) body.skin .ctl{display:grid!important}
html:not(#k):not(#j) body.skin #view>.colh .cs{margin-right:25px!important}
html:not(#k):not(#j) body.skin section .tiles{display:block!important;gap:0!important}
html:not(#k):not(#j) body.skin section .tiles>.tile{background:transparent!important;border:0!important;border-top:1px solid var(--sep)!important;border-radius:0!important;padding:14px 4px!important;min-height:0!important;margin:0!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin section .tiles>.tile:first-child{border-top:0!important}
html:not(#k):not(#j) body.skin section .tiles>.tile:hover{background:var(--fill)!important;border-radius:12px!important}
html:not(#k):not(#j) body.skin .tile .tn{font-size:16px!important;font-weight:500!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin .tile .tt{color:var(--mute)!important;font-size:13px!important}
html:not(#k):not(#j) body.skin .stats .stat{background:var(--card)!important}
html:not(#k):not(#j) body.skin .stats .stat:first-child{background:var(--black)!important}
html:not(#k):not(#j) body.skin .stats .stat:first-child :is(.sl,.sv){color:#fff!important}
html:not(#k):not(#j) body.skin .stats .stat:first-child .sl{color:rgba(255,255,255,.65)!important}
html:not(#k):not(#j) body.skin .stats .stat.bad:not(:first-child){background:var(--brand)!important}
html:not(#k):not(#j) body.skin .stats .stat.bad:not(:first-child) :is(.sl,.sv){color:#fff!important}
html:not(#k):not(#j) body.skin .bnav a svg{border-radius:12px!important}
html:not(#k):not(#j) body.skin .h span:last-child:not(.vsum),html:not(#k):not(#j) body.skin section>h2>span:last-child{border-radius:8px!important}
@media (max-width:760px){
html:not(#k):not(#j) body.skin .stats{gap:8px!important}
html:not(#k):not(#j) body.skin .stats .stat{padding:14px 10px!important;border-radius:18px!important}
html:not(#k):not(#j) body.skin .stats .stat .sv{font-size:22px!important}
html:not(#k):not(#j) body.skin .stats .stat .sl{font-size:11px!important;line-height:1.25}
}
html:not(#k):not(#j) body.skin #view>ul.list{background:var(--card)!important;border-radius:var(--rr)!important;padding:4px 20px!important;margin:0 0 14px!important}
html:not(#k):not(#j) body.skin #view>ul.list>li:first-child{border-top:0!important}

html:not(#k):not(#j) body.skin .tnote.tnote b{color:#fff!important;opacity:.85}
html:not(#k):not(#j) body.skin :is(.kpi em,.kpi small,.wkname,p.note,.dt,.bnav a span,.mw span){color:var(--mute)!important}
html:not(#k):not(#j) body.skin .bnav a[aria-current="page"] span{color:var(--brand)!important}
@media (max-width:760px){html:not(#k):not(#j) body.skin #secs{display:flex!important;flex-wrap:wrap!important;max-width:100%}}
html:not(#k):not(#j) body.skin .tnote.tnote.tnote.tnote b{color:#fff!important;opacity:.85}
html:not(#k):not(#j) body.skin #wk :is(span,small,em){color:var(--mute)!important}
html:not(#k):not(#j) body.skin :is(.r .c,.orow .c){color:var(--mute)!important}
html:not(#k):not(#j) body.skin .evtabs{background:var(--card)!important;padding:4px!important;border-radius:16px!important;gap:2px!important;border:0!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .evtabs button{background:transparent!important;border:0!important;border-radius:12px!important;color:var(--ink)!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .evtabs button[aria-selected="true"]{background:var(--brand)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .per span{color:var(--mute)!important}
html:not(#k):not(#j) body.skin .datebtn{border:0!important;background:var(--card)!important;border-radius:12px!important;color:var(--ink)!important}

/* recipe detail */
html:not(#k):not(#j) body.skin .box>:is(ol,ul){background:var(--card)!important;border-radius:var(--rr)!important;overflow:hidden;padding:4px 10px!important;margin:8px 0 18px!important;list-style:none;box-shadow:none!important}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li{border:0!important;margin:0!important;background:transparent!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li>button,html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li>label{background:transparent!important;border:0!important;border-top:1px solid var(--sep)!important;border-radius:0!important;box-shadow:none!important;margin:0!important;width:100%}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li:first-child>:is(button,label){border-top:0!important}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li>button[aria-pressed="true"]{background:var(--fill)!important}
html:not(#k):not(#j) body.skin .box .n{border-radius:8px!important;border:0!important;background:var(--fill)!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin .box button[aria-pressed="true"] .n{background:var(--brand)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .box h4{color:var(--mute)!important;font-size:13px!important;font-weight:600!important}
html:not(#k):not(#j) body.skin>button,html:not(#k):not(#j) body.skin button.back{border-radius:12px!important;box-shadow:none!important;border:0!important;background:var(--card)!important;color:var(--ink)!important}
/* events chips */
html:not(#k):not(#j) body.skin .adt{border-radius:12px!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .adgrid{background:transparent!important}
/* prep target stepper */
html:not(#k):not(#j) body.skin .tm{display:grid!important;grid-template-columns:44px 1fr 44px;background:var(--fill)!important;border-radius:12px!important;overflow:hidden;gap:0!important;border:0!important}
html:not(#k):not(#j) body.skin .tm>*{background:transparent!important;border:0!important;border-radius:0!important;box-shadow:none!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin .tm>button:last-child{background:var(--brand)!important;color:#fff!important}
html:not(#k):not(#j) body.skin .dtile{background:transparent!important;border-radius:12px!important;box-shadow:none!important}
html:not(#k):not(#j) body.skin .dtb{border-radius:12px!important}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li>*{border-radius:0!important}
html:not(#k):not(#j) body.skin .box>:is(ol,ul)>li:not(:first-child)>*{border-top:1px solid var(--sep)!important}
html:not(#k):not(#j) body.skin button[aria-label^="Back"]{border-radius:12px!important;box-shadow:none!important;border:0!important;background:var(--card)!important;color:var(--ink)!important}
html:not(#k):not(#j) body.skin .jump{background:var(--card)!important;border:0!important;border-radius:var(--rr)!important;box-shadow:none!important;padding:16px 20px!important}
html:not(#k):not(#j) body.skin .jump :is(input,button){border-radius:12px!important}
html:not(#k):not(#j) body.skin :is(#fab,.fab,button[aria-label="Report a low item"]){border-radius:16px!important;box-shadow:0 10px 24px -10px rgba(0,0,0,.4)!important}

/* near-white page: lift cards with a hairline + whisper shadow (light mode only; dark overrides below) */
html:not(#k):not(#j) body.skin :is(main section,#view>section,.card,#view>ul.usage,#view>ul.list,.kpi:not(.big),.stat,.wxt,.jump,.titlebar #nav,.seg,#secs,.evtabs,.box>ol,.box>ul,.sb a.sbi:not([aria-current="page"])){box-shadow:0 0 0 1px rgba(51,49,50,.06),0 1px 2px rgba(51,49,50,.04),0 8px 24px -16px rgba(51,49,50,.12)!important}

/* Overview: calm white tiles; only profit carries meaning */
html:not(#k):not(#j) body.skin .kpi.big{background:var(--card)!important;border:0!important;border-radius:var(--rr)!important}
html:not(#k):not(#j) body.skin .kpi.big b{font-size:40px!important;color:var(--ink)!important}
