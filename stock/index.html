:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topH,190px) + 12px);-webkit-text-size-adjust:100%}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto;text-transform:uppercase}
#sync{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 18px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:22px}
#sync.warn{background:#f2c230}
.tabwrap{background:var(--beige);padding:10px 24px 10px;border-bottom:4px solid var(--ink)}
.inner{max-width:calc(var(--mw,1000px) - 2*var(--px,24px));margin:0 auto}
.wkline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.wkname{background:var(--ink);color:var(--beige);border-radius:2px;padding:8px 16px;font-size:24px;text-transform:uppercase;letter-spacing:1px}
.wkname.closed{background:#7a7778}
.wkline .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab .sh{display:none}
.tab{min-height:60px;padding:0 16px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:22px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--brand)}

var KEY="kinhfolk-stock-v2";

var AVG=4;
var S={items:[],weeks:[],cur:null,drafts:{},queue:[],seq:0,nav:"added",sec:"",viewId:"",cache:{},usage:{},basis:"week",hist:"weeks",viewMonth:"",edrafts:{},edw:""};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){for(var k0 in S)if(p[k0]!==undefined)S[k0]=p[k0]}}}catch(e){}
S.viewId="";S.viewMonth="";
(function(){var h=(location.hash||"").slice(1);if(["added","ending","report","order","edit","history"].indexOf(h)>=0)S.nav=h})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function r2(v){return Math.round(v*100)/100}
function qtyText(n,unit){var u=String(unit||"").replace(/^(\d+(?:\.\d+)?)\s+([A-Za-z])/,"$1$2");return u?n+" x "+u:String(n)}
function fmt(n){return String(Math.round(n*1000)/1000)}
function money(n){return"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function keyOf(it){return it.section+" / "+it.item}
function itemByKey(k){for(var i=0;i<S.items.length;i++)if(keyOf(S.items[i])===k)return S.items[i];return null}
function sections(){var o=[];S.items.forEach(function(it){if(o.indexOf(it.section)<0)o.push(it.section)});return o}
function timeText(iso){
 if(!iso)return"";
 var d=new Date(iso);
 return isNaN(d)?"":d.toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

/* ---- Which week are we looking at ---- */
function viewing(){return S.viewId&&S.cache[S.viewId]?S.cache[S.viewId]:null}
function wk(){return viewing()||S.cur}
function editable(){return !viewing()&&S.cur&&S.cur.status==="open"}
function addedOf(w,key){var s=0;(w.additions||[]).forEach(function(a){if(a.key===key)s+=a.qty});return r2(s)}
function calc(w,it){
 var k=keyOf(it),b=typeof w.begin[k]==="number"?w.begin[k]:0,e=typeof w.end[k]==="number"?w.end[k]:null,a=addedOf(w,k);
 var cost=(w.status==="closed"&&typeof w.cost[k]==="number")?w.cost[k]:(it.cost||0);
 var used=e===null?null:Math.round((b+a-e)*1000)/1000;
 return{k:k,b:b,a:a,e:e,used:used,cost:cost,total:used===null?null:r2(used*cost),
  order:used!==null&&used>e,check:used!==null&&used<0,need:used!==null&&used>e?Math.ceil(used-e-1e-9):0};
}
function weekItems(w){
 if(w===S.cur)return S.items;
 return S.items.filter(function(it){var k=keyOf(it);return typeof w.begin[k]==="number"||typeof w.end[k]==="number"||addedOf(w,k)>0});
}
function rows(w){return weekItems(w).map(function(it){var c=calc(w,it);c.it=it;return c})}
function uncounted(w){return rows(w).filter(function(r){return r.e===null}).length}

/* ---- Applying changes (also used to rebuild after a reload) ---- */
function applyOp(w,op){
 if(!w||op.week!==w.id)return;
 if(op.type==="end"||op.type==="begin"){
  var m=op.type==="end"?w.end:w.begin;
  if(op.count===null)delete m[op.key];else m[op.key]=op.count;
 }else if(op.type==="add"){
  op.entries.forEach(function(en,i){
   var id=op.batch+"-"+i;
   if(!w.additions.some(function(a){return a.id===id}))w.additions.push({id:id,time:op.time,key:en.key,qty:en.qty,note:""});
  });
 }else if(op.type==="rm"){
  w.additions=w.additions.filter(function(a){return a.id!==op.id});
 }else if(op.type==="edit"){
  if(op.field==="begin"||op.field==="end"){
   var mm=op.field==="end"?w.end:w.begin;
   if(op.value===null)delete mm[op.key];else mm[op.key]=op.value;
  }else if(op.field==="added"){
   var lid="edit-local-"+op.key;
   w.additions=w.additions.filter(function(a){return a.id!==lid});
   var dl=r2(op.value-addedOf(w,op.key));
   if(dl!==0)w.additions.push({id:lid,time:op.time||new Date().toISOString(),key:op.key,qty:dl,note:"Edited"});
  }
 }
}
function rebase(w){
 var c=JSON.parse(JSON.stringify(w));
 S.queue.forEach(function(op){applyOp(c,op)});
 return c;
}

/* ---- Rendering ---- */
function navList(){
 return editable()?[["added","Added","Added"],["ending","Ending count","Ending"],["report","Report","Report"],["order","Order list","Order"],["edit","Edit week","Edit"],["history","History","History"]]
  :[["report","Report","Report"],["order","Order list","Order"],["edit","Edit week","Edit"],["history","History","History"]];
}
function curNav(){
 var l=navList(),ok=false;
 l.forEach(function(x){if(x[0]===S.nav)ok=true});
 return ok?S.nav:l[0][0];
}
/* Order suggestions: expected weekly use (last week, or the average of the last AVG weeks) minus what is left, rounded up. */
function orderRows(w,basis){
 basis=basis||S.basis;
 var hist=[];
 for(var i=0;i<S.weeks.length;i++){var x=S.weeks[i];if(x.id===w.id)break;if(x.status==="closed")hist.push(x.id)}
 var out=[];
 rows(w).forEach(function(r){
  if(r.e===null)return;
  var smp=[Math.max(0,r.used)];
  if(basis==="month"){
   for(var j=hist.length-1;j>=0&&smp.length<AVG;j--){var u=S.usage[hist[j]]&&S.usage[hist[j]][r.k];if(u)smp.push(Math.max(0,u[0]))}
  }
  var f=0;smp.forEach(function(v){f+=v});f=f/smp.length;
  var need=Math.ceil(f-r.e-1e-9);
  if(need>0){r.sug=need;r.exp=f;r.samples=smp.length;out.push(r)}
 });
 return out;
}
function orderCount(w){return orderRows(w).length}
function draftCount(){return Object.keys(S.drafts).length}
function renderBanner(){
 var w=wk(),h="";
 if(w){
  h='<span class="wkname'+(w.status==="closed"?" closed":"")+'">'+esc(w.label)+" \u00B7 "+(w.status==="closed"?"Closed":"Open")+'</span><span class="sp"></span>';
  if(viewing())h+='<button type="button" class="big green" id="backcur">Back to this week</button>';
 }else h='<span class="wkname closed">No week open</span>';
 $("wkline").innerHTML=h;
 var b=$("backcur");if(b)b.addEventListener("click",function(){S.viewId="";S.nav="report";persist();renderAll();window.scrollTo(0,0)});
}
function renderNav(){
 var cur=curNav(),w=wk(),h="";
 navList().forEach(function(x){
  var bd="";
  if(w){
   if(x[0]==="ending"){var u=uncounted(w);bd=u?u:""}
   if(x[0]==="order"){var o=orderCount(w);bd=o?o:""}
   if(x[0]==="added"){var d=draftCount();bd=d?d:""}
  }
  h+='<button type="button" class="tab" role="tab" data-nav="'+x[0]+'" aria-selected="'+(cur===x[0])+'">'+'<span class="lg">'+esc(x[1])+'</span><span class="sh">'+esc(x[2])+'</span>'+(bd!==""?'<span class="bd" aria-hidden="true">'+bd+'</span>':"")+'</button>';
 });
 $("nav").innerHTML=h;
}
function curSec(){var s=sections();return s.indexOf(S.sec)>=0?S.sec:(s[0]||"")}
function renderSecs(){
 var show=((curNav()==="added"||curNav()==="ending")&&editable()||curNav()==="edit"&&!!wk())&&S.items.length>0;
 $("secs").hidden=!show;
 if(!show)return;
 var cs=curSec(),h="";
 sections().forEach(function(s){h+='<button type="button" class="sec" data-sec="'+esc(s)+'" aria-pressed="'+(s===cs)+'">'+esc(s)+'</button>'});
 $("secs").innerHTML=h;
}
function renderBar(){
 var nv=curNav(),isE=nv==="ending",show=(nv==="added"||isE)&&editable(),n=isE?edCount():draftCount();
 $("bar").hidden=!show;

/* Ending count */
function chipBox(r){
 if(r.e===null)return{cls:"none",label:"Not counted",main:"\u2013"};
 if(r.check)return{cls:"warn",label:"! Check count",main:"Used "+fmt(r.used)};
 if(r.order)return{cls:"bad",label:"\u2715 Order",main:"Used "+fmt(r.used)};
 return{cls:"ok",label:"\u2713 Used",main:fmt(r.used)};
}
function calcDraft(w,it){
 var c=calc(w,it);
 if(S.edrafts[c.k]!==undefined){var e=S.edrafts[c.k];c.e=e;c.used=Math.round((c.b+c.a-e)*1000)/1000;c.total=r2(c.used*c.cost);c.order=c.used>e;c.check=c.used<0}
 return c;
}
function edCount(){return Object.keys(S.edrafts).length}
function setEd(it,n){
 var k=keyOf(it),c=calc(S.cur,it);
 if(n===null||(c.e!==null&&n===c.e))delete S.edrafts[k];else S.edrafts[k]=n;
}
function paintEnd(idx){
 var it=S.items[idx],box=$("e"+idx);
 if(!box)return;

}

/* Report */
function sectionTotals(w){
 var out=[];
 sections().forEach(function(s){
  var rs=rows(w).filter(function(r){return r.it.section===s});
  if(!rs.length)return;
  var t=0;rs.forEach(function(r){if(r.total!==null)t+=r.total});
  out.push({section:s,rows:rs,total:r2(t)});
 });
 return out;
}

function reportText(){

/* Order list: by vendor, then by section */
function vendorGroups(w){
 var by={},names=[];
 orderRows(w).forEach(function(r){
  var v=r.it.vendor||"No vendor set";
  if(!by[v]){by[v]=[];names.push(v)}
  by[v].push(r);
 });
 names.sort(function(a,b){if(a==="No vendor set")return 1;if(b==="No vendor set")return -1;return a.localeCompare(b)});
 return names.map(function(v){
  var secs=[];
  by[v].forEach(function(r){
   var g=null;secs.forEach(function(x){if(x.section===r.it.section)g=x});
   if(!g){g={section:r.it.section,rows:[]};secs.push(g)}
   g.rows.push(r);
  });
  return{vendor:v,sections:secs};
 });
}

/* History: weekly or monthly. A week belongs to the month its Thursday falls in. */
function monthName(m){var p=String(m).split("-");return new Date(+p[0],+p[1]-1,1).toLocaleString("en-US",{month:"long",year:"numeric"})}
function monthOf(w){return w.month||""}
function monthGroups(){
 var by={},ms=[];
 S.weeks.forEach(function(w){
  var m=monthOf(w);if(!m)return;
  if(!by[m]){by[m]={month:m,weeks:[],total:0,closed:0,open:false};ms.push(by[m])}
  by[m].weeks.push(w);
  if(w.status==="closed"){by[m].closed++;by[m].total+=(typeof w.total==="number"?w.total:0)}else by[m].open=true;
 });
 ms.sort(function(a,b){return a.month<b.month?1:-1});
 ms.forEach(function(g){g.total=r2(g.total)});
 return ms;
}
function monthSums(g){
 var items={};
 g.weeks.forEach(function(w){
  if(w.status!=="closed")return;
  var u=S.usage[w.id]||{};
  Object.keys(u).forEach(function(k){
   var x=items[k]||(items[k]={used:0,cost:0});
   x.used+=u[k][0];x.cost+=u[k][0]*u[k][1];
  });
 });
 var out=[];
 sections().forEach(function(sec){
  var rs=[],t=0;
  S.items.forEach(function(it){
   if(it.section!==sec)return;
   var x=items[keyOf(it)];
   if(!x||(x.used===0&&x.cost===0))return;
   rs.push({it:it,used:r2(x.used),avg:r2(x.used/Math.max(1,g.closed)),cost:r2(x.cost)});t+=x.cost;
  });
  if(rs.length)out.push({section:sec,rows:rs,total:r2(t)});
 });
 return out;
}

 return'<div class="seg" role="group" aria-label="History view"><button type="button" data-hist="weeks" aria-pressed="'+(S.hist==="weeks")+'">Weekly</button><button type="button" data-hist="months" aria-pressed="'+(S.hist==="months")+'">Monthly</button></div>';
}
function historyHtml(){

function monthsHtml(){

 ms.forEach(function(g,i){
  var prev=ms[i+1],delta="";
  if(prev&&prev.closed&&g.closed&&prev.total>0){var pc=Math.round((g.total/g.closed-prev.total/prev.closed)/(prev.total/prev.closed)*100);delta=(pc>0?"+":"")+pc+"% per week vs "+monthName(prev.month).split(" ")[0]}
  h+='<button type="button" class="tile'+(g.open&&!g.closed?" open":"")+'" data-month="'+esc(g.month)+'"><span class="tn">'+esc(monthName(g.month))+'</span><span class="ts">'+g.closed+(g.closed===1?" week":" weeks")+(g.open?" + open week":"")+'</span><span class="tc">'+esc(g.closed?money(g.total):"–")+'</span>'+(delta?'<span class="ts">'+esc(delta)+'</span>':"")+'</button>';
 });
 if(!ms.length)h+='<p class="empty">No weeks yet.</p>';
 return h+'</div>';
}
function monthByKey(m){var r=null;monthGroups().forEach(function(g){if(g.month===m)r=g});return r}
function monthHtml(m){

 if(g.open)h+='<p class="note">There is an open week in this month. It is added here once you close it.</p>';

 g.weeks.slice().reverse().forEach(function(w){h+='<button type="button" class="tile'+(w.status==="open"?" open":"")+'" data-week="'+esc(w.id)+'"><span class="tn">'+esc(w.label)+'</span><span class="ts">'+(w.status==="open"?"Open now":"Closed")+'</span>'+(w.status==="open"?"":'<span class="tc">'+esc(typeof w.total==="number"?money(w.total):"")+'</span>')+'</button>'});
 h+='</div></section>';
 secs.forEach(function(sc){
  h+='<section><h2 class="h"><span>'+esc(sc.section)+'</span><span>'+esc(money(sc.total))+'</span></h2>';
  sc.rows.forEach(function(r){

  });
  h+='</section>';
 });
 if(!secs.length)h+='<p class="empty">No usage details for this month yet.</p>';
 return h;
}
function monthText(m){

 var lines=["COGS report - "+monthName(m),"Total COGS: "+money(g.total)+" over "+g.closed+(g.closed===1?" week":" weeks")+" ("+g.weeks.filter(function(w){return w.status==="closed"}).map(function(w){return w.label}).join(", ")+")"];

/* ---- Export for Google Sheets ---- */
function cell(v,delim){
 if(v===null||v===undefined)return"";
 var t=String(v);
 return(t.indexOf(delim)>=0||/["\n\r]/.test(t))?'"'+t.replace(/"/g,'""')+'"':t;
}
function toText(rows,delim){return rows.map(function(r){return r.map(function(v){return cell(v,delim)}).join(delim)}).join("\n")}
function slug(t){return String(t).toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function exportRows(kind){
 var w=wk(),out=[];
 if(kind==="report"){
  out.push(["Section","Item","Unit","Begin","Added","End","Used","Unit cost","COGS"]);
  rows(w).forEach(function(r){out.push([r.it.section,r.it.item,r.it.unit||"",r.b,r.a,r.e===null?"":r.e,r.used===null?"":r.used,r.cost,r.total===null?"":r.total])});
  out.push(["Total","","","","","","","",totalCogs(w)]);
  return{name:"report-"+slug(w.label),rows:out};
 }
 if(kind==="order"){
  out.push(["Vendor","Section","Item","Order","Unit","Order (x unit)","Left","Expected per week","Unit cost","Estimated cost"]);
  vendorGroups(w).forEach(function(vg){vg.sections.forEach(function(sg){sg.rows.forEach(function(r){

var edited={},pendingRender=false;
var inflight=null,flushing=false,flushTimer=null,retryMs=0,netErr=false,lastError="",loaded=false,stale=false,busy=false;
function plural(n){return n===1?"1 change":n+" changes"}
function status(){
 var n=S.queue.length,el=$("sync"),msg,warn=false;
 if(notice){el.textContent=notice.text;el.className=notice.warn?"warn":"";return}
 if(!HAS_API){msg="\u26A0 Not connected \u2013 changes are kept on this tablet only";warn=true}
 else if(!loaded)msg="Loading\u2026";
 else if(!navigator.onLine){msg="\u26A0 Offline \u2013 "+(n?plural(n)+" waiting to send":"changes are kept on this tablet");warn=true}
 else if(inflight||busy)msg="Saving\u2026";
 else if(netErr&&n){msg="\u26A0 Can\u2019t reach the saving service \u2013 "+plural(n)+" waiting, retrying";warn=true}
 else if(n)msg="Waiting to save\u2026 "+plural(n);
 else if(stale){msg="\u26A0 Couldn\u2019t load shared data \u2013 showing this tablet\u2019s copy";warn=true}
 else if(lastError){msg="\u26A0 A change was not accepted: "+lastError;warn=true}
 else msg="\u2713 All changes saved";
 el.textContent=msg;el.className=warn?"warn":"";
}
function post(body){
 var ctl=typeof AbortController==="function"?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},25000);
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()})
  .then(function(d){clearTimeout(to);return d},function(e){clearTimeout(to);throw e});
}
function bodyFor(op){
 if(op.type==="edit")return{action:"editWeek",week:op.week,key:op.key,field:op.field,value:op.value};
 if(op.type==="end")return{action:"setEnding",week:op.week,key:op.key,count:op.count};
 if(op.type==="begin")return{action:"setBeginning",week:op.week,key:op.key,count:op.count};
 if(op.type==="add")return{action:"addBatch",week:op.week,batch:op.batch,entries:op.entries};
 return{action:"removeAddition",week:op.week,id:op.id};
}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(function(){flushTimer=null;flush()},ms)}
function enqueue(op){
 if(op.type==="end"||op.type==="begin"||op.type==="edit")S.queue=S.queue.filter(function(o){return(inflight&&o.qid===inflight.qid)||o.type!==op.type||o.key!==op.key||o.week!==op.week||o.field!==op.field});
 op.qid=++S.seq;S.queue.push(op);persist();status();scheduleFlush(600);
}
async function flush(){
 if(flushing)return;
 if(!HAS_API||!S.queue.length||!navigator.onLine){status();return}
 flushing=true;var failed=false,rejected=false;
 while(S.queue.length&&navigator.onLine){
  var op=S.queue[0];inflight=op;status();
  try{
   var d=await post(bodyFor(op));
   S.queue=S.queue.filter(function(o){return o.qid!==op.qid});
   if(op.type==="edit")edited[op.week]=true;
   if(d&&d.ok){netErr=false;lastError="";retryMs=0;stale=false}
   else{lastError=(d&&d.error)||"unknown error";rejected=true}
   persist();
  }catch(e){netErr=true;failed=true;break}
 }
 inflight=null;flushing=false;
 if(!failed&&!S.queue.length&&Object.keys(edited).length){Object.keys(edited).forEach(function(id){delete S.cache[id]});edited={};loadRemote()}
 if(failed){retryMs=Math.min(60000,retryMs?retryMs*2:5000);scheduleFlush(retryMs)}
 status();
 if(rejected&&!failed)loadRemote(true);
}
async function waitForQueue(){
 for(var i=0;i<60&&(S.queue.length||flushing);i++){
  if(!flushing&&S.queue.length)await flush();
  if(S.queue.length||flushing)await new Promise(function(r){setTimeout(r,250)});
 }
 return!S.queue.length;
}
async function fetchJson(url){var r=await fetch(url,{cache:"no-store"});return r.json()}
async function loadRemote(force){
 var changed=false;
 if(HAS_API){
  try{
   var d=await fetchJson(API+(S.viewId&&!S.cache[S.viewId]?"?week="+encodeURIComponent(S.viewId):""));
   if(!d||!d.ok||!Array.isArray(d.items))throw new Error("bad response");
   var before=JSON.stringify([S.items,S.weeks,S.cur,S.usage]);
   S.items=d.items;S.weeks=d.weeks||[];S.usage=d.usage||{};
   S.cur=d.current?rebase(d.current):null;
   if(S.cur&&S.edw!==S.cur.id){S.edrafts={};S.edw=S.cur.id}
   if(d.week)S.cache[d.week.id]=rebase(d.week);
   S.weeks.forEach(function(w){if(w.status==="open"&&S.cache[w.id])delete S.cache[w.id]});
   persist();stale=false;
   changed=before!==JSON.stringify([S.items,S.weeks,S.cur,S.usage]);
  }catch(e){stale=true}
 }
 var first=!loaded;loaded=true;
 if(first||changed||force){var ae=document.activeElement;if(!first&&ae&&ae.tagName==="INPUT")pendingRender=true;else renderAll()}
 status();
}

  if(!HAS_API||!navigator.onLine){showNotice("\u26A0 Connect to the internet to open an older week",true,7000);return}
  try{var d=await fetchJson(API+"?week="+encodeURIComponent(id));if(d&&d.ok&&d.week)S.cache[id]=rebase(d.week);else throw new Error("no week")}
  catch(e){showNotice("\u26A0 Couldn\u2019t load that week",true,7000);return}

async function closeWeek(){
 if(!HAS_API||!navigator.onLine){showNotice("\u26A0 Connect to the internet to close the week",true,8000);return}
 busy=true;status();
 var okq=await waitForQueue();
 if(!okq){busy=false;showNotice("\u26A0 Some changes haven\u2019t saved yet. Try again in a moment",true,8000);return}
 try{
  var id=S.cur.id,d=await post({action:"closeWeek",week:id,basis:S.basis});
  busy=false;
  if(d&&d.ok){
   await loadRemote(true);

   if(dd&&dd.week){S.cache[id]=rebase(dd.week);S.viewId=id;S.nav="report";persist()}
   renderAll();window.scrollTo(0,0);
   var dm=d.discord==="sent"?" Order list sent to Discord.":(d.discord==="not_set"?" Discord isn\u2019t set up yet.":(d.discord?" Discord problem: "+String(d.discord).replace(/^error: /,""):""));
   showNotice("\u2713 Week closed. Total COGS "+money(d.total)+"."+dm,!!(d.discord&&d.discord!=="sent"&&d.discord!=="not_set"),14000);
  }else{status();showNotice("\u26A0 "+((d&&d.error)||"Couldn\u2019t close the week"),true,10000)}
 }catch(e){busy=false;showNotice("\u26A0 Couldn\u2019t reach the saving service",true,8000)}
}
async function sendOrder(){
 var w=wk();if(!w)return;
 if(!HAS_API||!navigator.onLine){showNotice("\u26A0 Connect to the internet to send",true,8000);return}
 var n=vendorGroups(w).length;
 ask("Send order list to Discord?",(n?"The "+basisLabel(S.basis)+" order list for ":"Nothing to order for ")+w.label+" is posted to your Discord channel.","Send","green",async function(){
  busy=true;status();
  var okq=await waitForQueue();
  if(!okq){busy=false;status();showNotice("\u26A0 Some changes haven\u2019t saved yet. Try again in a moment",true,8000);return}
  try{

   busy=false;status();
   if(d&&d.ok)showNotice("\u2713 Order list sent to Discord",false,7000);
   else showNotice("\u26A0 "+((d&&d.error)||"Couldn\u2019t send to Discord"),true,10000);
  }catch(e){busy=false;status();showNotice("\u26A0 Couldn\u2019t reach the saving service",true,8000)}
 },$("sendorder"));
}

 if(!HAS_API||!navigator.onLine){showNotice("\u26A0 Connect to the internet to start a week",true,8000);return}
 try{var d=await post({action:"startWeek"});if(d&&d.ok){await loadRemote(true)}else showNotice("\u26A0 "+((d&&d.error)||"Couldn\u2019t start a week"),true,8000)}

document.addEventListener("focusout",function(){if(pendingRender)setTimeout(function(){var a=document.activeElement;if(pendingRender&&!(a&&a.tagName==="INPUT")){pendingRender=false;renderAll()}},150)});

btn.setAttribute("aria-expanded","false");btn.setAttribute("aria-controls","mnlist");btn.setAttribute("aria-haspopup","true");
btn.innerHTML='<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true" focusable="false"><path d="M3 5h18v3H3zm0 5.5h18v3H3zM3 16h18v3H3z"/></svg><span>Menu</span>';
var list=document.createElement("nav");
list.id="mnlist";list.className="mnlist";list.hidden=true;list.setAttribute("aria-label","Pages");
list.innerHTML=PAGES.map(function(p){return'<a href="'+p[2]+'"'+(p[0]===here?' aria-current="page"':"")+'><span>'+p[1]+'</span>'+(p[0]===here?'<span aria-hidden="true">✓</span>':"")+'</a>'}).join("");
if(sy)hd.insertBefore(btn,sy);else hd.appendChild(btn);
document.body.appendChild(list);
function place(){
 var r=btn.getBoundingClientRect(),w=list.offsetWidth,vw=document.documentElement.clientWidth||window.innerWidth;
 list.style.top=Math.round(r.bottom+8)+"px";
 list.style.right="auto";
 list.style.left=Math.round(Math.max(12,Math.min(r.right-w,vw-w-12)))+"px";
}
function open(){list.hidden=false;place();btn.setAttribute("aria-expanded","true");var c=list.querySelector('[aria-current]')||list.querySelector("a");if(c)c.focus()}
function close(back){list.hidden=true;btn.setAttribute("aria-expanded","false");if(back)btn.focus()}
btn.addEventListener("click",function(){list.hidden?open():close(true)});
document.addEventListener("click",function(e){if(!list.hidden&&!list.contains(e.target)&&!btn.contains(e.target))close(false)});
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&!list.hidden){e.stopPropagation();close(true)}},true);
window.addEventListener("resize",function(){if(!list.hidden)place()});
window.addEventListener("scroll",function(){if(!list.hidden)place()},{passive:true});
})();
</script>
</body>
