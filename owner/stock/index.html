/* ---- Applying changes (also used to rebuild after a reload) ---- */
function applyOp(w,op){
 if(!w||op.week!==w.id)return;
 if(op.type==="end"||op.type==="begin"){
  var m=op.type==="end"?w.end:w.begin;
  if(op.count===null)delete m[op.key];else m[op.key]=op.count;
 }else if(op.type==="add"){
  op.entries.forEach(function(en,i){
   var id=op.batch+"-"+i;
   var sit=itemByKey(en.key),fromS=!!(sit&&sit.storage)&&en.src!=="delivery";
   if(!w.additions.some(function(a){return a.id===id})){w.additions.push({id:id,time:op.time,key:en.key,qty:en.qty,note:en.src==="delivery"?"Delivery":fromS?"From storage":""});}
   (w.alerts||[]).forEach(function(a){if(a.key===en.key&&a.status==="active"){a.status="cleared";a.reason="restocked"}});
  });
 }else if(op.type==="ord"){
  op.entries.forEach(function(en,i){var id=op.batch+"-"+i;if(!S.orders.some(function(o){return o.id===id}))S.orders.push({id:id,vendor:op.vendor,key:en.key,qty:en.qty,ordered:op.ordered,expected:en.expected,note:""})});
 }else if(op.type==="recv"){
  op.ids.forEach(function(id){
   var o=null;S.orders.forEach(function(x){if(x.id===id)o=x});
   if(o){var it=itemByKey(o.key);if(!(it&&it.storage)&&!w.additions.some(function(a){return a.id==="recv-"+id}))w.additions.push({id:"recv-"+id,time:op.time,key:o.key,qty:o.qty,note:"Delivered"});if(!(it&&it.storage))(w.alerts||[]).forEach(function(a){if(a.key===o.key&&a.status==="active"){a.status="cleared";a.reason="restocked"}})}
  });
  S.orders=S.orders.filter(function(o){return op.ids.indexOf(o.id)<0});
 }else if(op.type==="ordx"){
  S.orders=S.orders.filter(function(o){return o.id!==op.id});
 }else if(op.type==="sadd"){
  w.storageAdds=w.storageAdds||[];
  op.entries.forEach(function(en,i){var id="s"+op.batch+"-"+i;if(!w.storageAdds.some(function(a){return a.id===id}))w.storageAdds.push({id:id,time:op.time,key:en.key,qty:en.qty,note:"Delivery"})});
 }else if(op.type==="srm"){
  w.storageAdds=(w.storageAdds||[]).filter(function(a){return a.id!==op.id});
 }else if(op.type==="stor"){
  op.entries.forEach(function(en){S.storage[en.key]=en.count});
 }else if(op.type==="alert"){
  w.alerts=w.alerts||[];
  if(!w.alerts.some(function(a){return a.id===op.id})&&!alertFor(w,op.key))w.alerts.push({id:op.id,week:op.week,count:(typeof op.count==="number"?op.count:null),time:op.time,key:op.key,by:op.by||"",note:op.note||"",status:"active",cleared:null,reason:""});
 }else if(op.type==="resolve"){
  (w.alerts||[]).forEach(function(a){if(a.id===op.id&&a.status==="active"){a.status="cleared";a.reason="resolved by hand"}});
 }else if(op.type==="rm"){
  w.additions=w.additions.filter(function(a){return a.id!==op.id});
 }else if(op.type==="edit"){
  if(op.field==="begin"||op.field==="end"){
   var mm=op.field==="end"?w.end:w.begin;
   if(op.value===null)delete mm[op.key];else mm[op.key]=op.value;
  }else if(op.field==="added"){
   var lid="edit-local-"+op.key;
   w.additions=w.additions.filter(function(a){return a.id!==lid});

   if(dl!==0)w.additions.push({id:lid,time:op.time||new Date().toISOString(),key:op.key,qty:dl,note:"Edited"});
   if(dl>0)(w.alerts||[]).forEach(function(a){if(a.key===op.key&&a.status==="active"){a.status="cleared";a.reason="restocked"}});
  }

}

function kfPlan(samples,end,o){

}
