:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + var(--topH,190px) + 12px);-webkit-text-size-adjust:100%}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button,input{font:inherit}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto;text-transform:uppercase}
#sync{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 18px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:22px}
#sync.warn{background:#f2c230}
.tabwrap{background:var(--beige);padding:10px 24px 10px;border-bottom:4px solid var(--ink)}
.inner{max-width:calc(var(--mw,1000px) - 2*var(--px,24px));margin:0 auto}
.wkline{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:8px}
.wkname{background:var(--ink);color:var(--beige);border-radius:2px;padding:8px 16px;font-size:24px;text-transform:uppercase;letter-spacing:1px}
.wkname.closed{background:#7a7778}
.wkline .sp{flex:1}
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab .sh{display:none}
.tab{min-height:60px;padding:0 16px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:22px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;text-transform:uppercase}
.tab[aria-selected="true"]{background:var(--brand)}

<script>
(function(){
/* ---- Setting: paste your Google Apps Script web app address between the quotes ---- */
var API="https://script.google.com/macros/s/AKfycbwD87ttdlNAqROnHrWgwhuJUxsB43yG55RJUuLiObC6Uet0E3jCI727FF25FP2odyFs/exec";
var HAS_API=/^https:\/\/script\.google\.com\//.test(API);
var KEY="kinhfolk-stock-v2";

var AVG=4;
var S={items:[],weeks:[],cur:null,drafts:{},queue:[],seq:0,nav:"added",sec:"",viewId:"",cache:{},usage:{},basis:"week",hist:"weeks",rv:"week",viewMonth:"",edrafts:{},edw:"",lowSel:"",lowOpen:false,lowAdd:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){for(var k0 in S)if(p[k0]!==undefined)S[k0]=p[k0]}}}catch(e){}
S.viewId="";S.viewMonth="";
(function(){var h=(location.hash||"").slice(1);if(["added","ending","report","order","edit","history"].indexOf(h)>=0)S.nav=h;if(h==="history"){S.nav="report";S.rv="past"}})();
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
var $=function(id){return document.getElementById(id)};
function esc(t){return String(t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function r2(v){return Math.round(v*100)/100}
function qtyText(n,unit){var u=String(unit||"").replace(/^(\d+(?:\.\d+)?)\s+([A-Za-z])/,"$1$2");return u?n+" x "+u:String(n)}
function fmt(n){return String(Math.round(n*1000)/1000)}
function money(n){return"$"+Number(n).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function keyOf(it){return it.section+" / "+(it.rawItem||it.item)}
function stepOf(it){return it&&/syrup/i.test(it.item)?0.25:1}
function itemByKey(k){for(var i=0;i<S.items.length;i++)if(keyOf(S.items[i])===k)return S.items[i];return null}
var GRP={"beans + matcha":"Coffee + Matcha","milk + juices":"Milks","syrups + garnish":"Syrups","cups":"Cups","dry goods":"Cups","cleaning":"Supplies","paper goods":"Supplies"};
function grp(it){var k=String(it.section||"").toLowerCase();return GRP[k]||it.section}
function counted(it){return !it.alertOnly}
function required(it){return !it.optional}
function sections(){var o=[];S.items.forEach(function(it){var g=grp(it);if(counted(it)&&o.indexOf(g)<0)o.push(g)});var pr=["Coffee + Matcha","Milks","Syrups","Cups","Supplies","Retail"];return o.sort(function(a,b){var x=pr.indexOf(a),y=pr.indexOf(b);return(x<0?9:x)-(y<0?9:y)})}
function timeText(iso){
 if(!iso)return"";
 var d=new Date(iso);
 return isNaN(d)?"":d.toLocaleString([],{weekday:"short",month:"short",day:"numeric",hour:"numeric",minute:"2-digit"});
}

/* ---- Which week are we looking at ---- */
function viewing(){return S.viewId&&S.cache[S.viewId]?S.cache[S.viewId]:null}
function wk(){return viewing()||S.cur}
function editable(){return !viewing()&&S.cur&&S.cur.status==="open"}
function addedOf(w,key){var s=0;(w.additions||[]).forEach(function(a){if(a.key===key)s+=a.qty});return r2(s)}
function calc(w,it){
 var k=keyOf(it),b=typeof w.begin[k]==="number"?w.begin[k]:0,e=typeof w.end[k]==="number"?w.end[k]:null,a=addedOf(w,k);
 var cost=(w.status==="closed"&&typeof w.cost[k]==="number")?w.cost[k]:(it.cost||0);
 var used=e===null?null:Math.round((b+a-e)*1000)/1000;
 return{k:k,b:b,a:a,e:e,used:used,cost:cost,total:used===null?null:r2(used*cost),
  order:used!==null&&used>e,check:used!==null&&used<0,need:used!==null&&used>e?Math.ceil(used-e-1e-9):0};
}
function weekItems(w){
 if(w===S.cur)return S.items.filter(counted);
 return S.items.filter(function(it){if(!counted(it))return false;var k=keyOf(it);return typeof w.begin[k]==="number"||typeof w.end[k]==="number"||addedOf(w,k)>0});
}
function rows(w){return weekItems(w).map(function(it){var c=calc(w,it);c.it=it;return c})}
function uncounted(w){return rows(w).filter(function(r){return r.e===null&&required(r.it)}).length}

/* ---- Applying changes (also used to rebuild after a reload) ---- */
function applyOp(w,op){
 if(!w||op.week!==w.id)return;
 if(op.type==="end"||op.type==="begin"){
  var m=op.type==="end"?w.end:w.begin;
  if(op.count===null)delete m[op.key];else m[op.key]=op.count;
 }else if(op.type==="add"){
  op.entries.forEach(function(en,i){
   var id=op.batch+"-"+i;
   if(!w.additions.some(function(a){return a.id===id}))w.additions.push({id:id,time:op.time,key:en.key,qty:en.qty,note:""});
   (w.alerts||[]).forEach(function(a){if(a.key===en.key&&a.status==="active"){a.status="cleared";a.reason="restocked"}});
  });
 }else if(op.type==="alert"){
  w.alerts=w.alerts||[];
  if(!w.alerts.some(function(a){return a.id===op.id})&&!alertFor(w,op.key))w.alerts.push({id:op.id,week:op.week,count:(typeof op.count==="number"?op.count:null),time:op.time,key:op.key,by:op.by||"",note:op.note||"",status:"active",cleared:null,reason:""});
 }else if(op.type==="resolve"){
  (w.alerts||[]).forEach(function(a){if(a.id===op.id&&a.status==="active"){a.status="cleared";a.reason="resolved by hand"}});
 }else if(op.type==="rm"){
  w.additions=w.additions.filter(function(a){return a.id!==op.id});
 }else if(op.type==="edit"){
  if(op.field==="begin"||op.field==="end"){
   var mm=op.field==="end"?w.end:w.begin;
   if(op.value===null)delete mm[op.key];else mm[op.key]=op.value;
  }else if(op.field==="added"){
   var lid="edit-local-"+op.key;
   w.additions=w.additions.filter(function(a){return a.id!==lid});
   var dl=r2(op.value-addedOf(w,op.key));
   if(dl!==0)w.additions.push({id:lid,time:op.time||new Date().toISOString(),key:op.key,qty:dl,note:"Edited"});
   if(dl>0)(w.alerts||[]).forEach(function(a){if(a.key===op.key&&a.status==="active"){a.status="cleared";a.reason="restocked"}});
  }
 }
}
function rebase(w){
 var c=JSON.parse(JSON.stringify(w));
 S.queue.forEach(function(op){applyOp(c,op)});
 return c;
}

/* ---- Rendering ---- */
var ROLE=document.documentElement.getAttribute("data-site")==="owner"?"owner":"staff";
function navList(){
 return ROLE==="owner"?[["added","Added","Added"],["ending","Ending count","Ending"],["order","Order list","Order"],["report","Report","Report"]]
  :[["added","Added","Added"],["ending","Ending count","Ending"]];
}
function curNav(){
 if(S.nav==="history"){S.nav="report";S.rv="past"}
 var l=navList(),ok=ROLE==="owner"&&S.nav==="edit";
 l.forEach(function(x){if(x[0]===S.nav)ok=true});
 return ok?S.nav:l[0][0];
}
/* Order suggestions: expected weekly use (last week, or the average of the last AVG weeks) minus what is left, rounded up. */
function orderRows(w,basis){
 basis=basis||S.basis;
 var hist=[];
 for(var i=0;i<S.weeks.length;i++){var x=S.weeks[i];if(x.id===w.id)break;if(x.status==="closed")hist.push(x.id)}
 var out=[];
 rows(w).forEach(function(r){
  if(r.e===null)return;
  var smp=[Math.max(0,r.used)];
  if(basis==="month"){
   for(var j=hist.length-1;j>=0&&smp.length<AVG;j--){var u=S.usage[hist[j]]&&S.usage[hist[j]][r.k];if(u)smp.push(Math.max(0,u[0]))}
  }
  var f=0;smp.forEach(function(v){f+=v});f=f/smp.length;
  var need=Math.ceil(f-r.e-1e-9);
  if(need>0){r.sug=need;r.exp=f;r.samples=smp.length;out.push(r)}
 });
 return out;
}
function orderCount(w){return orderRows(w).length}
function activeAlerts(w){return((w&&w.alerts)||[]).filter(function(a){return a.status==="active"})}
function alertFor(w,key){var r=null;activeAlerts(w).forEach(function(a){if(a.key===key)r=a});return r}
function draftCount(){return Object.keys(S.drafts).length}
function renderBanner(){

 navList().forEach(function(x){

function renderSecs(){

/* Ending count */
function chipBox(r){
 if(r.e===null)return{cls:"none",label:"Not counted",main:"\u2013"};
 if(r.check)return{cls:"warn",label:"! Check count",main:"Used "+fmt(r.used)};
 if(r.order)return{cls:"bad",label:"\u2715 Order",main:"Used "+fmt(r.used)};
 return{cls:"ok",label:"\u2713 Used",main:fmt(r.used)};
}
function calcDraft(w,it){
 var c=calc(w,it);
 if(S.edrafts[c.k]!==undefined){var e=S.edrafts[c.k];c.e=e;c.used=Math.round((c.b+c.a-e)*1000)/1000;c.total=r2(c.used*c.cost);c.order=c.used>e;c.check=c.used<0}
 return c;
}
function edCount(){return Object.keys(S.edrafts).length}
function setEd(it,n){
 var k=keyOf(it),c=calc(S.cur,it);
 if(n===null||(c.e!==null&&n===c.e))delete S.edrafts[k];else S.edrafts[k]=n;
}
function paintEnd(idx){
 var it=S.items[idx],box=$("e"+idx);
 if(!box)return;
 var c=chipBox(calcDraft(S.cur,it));
 box.className="ob "+c.cls;
 box.innerHTML='<span class="ol">'+esc(c.label)+'</span><span class="on">'+esc(c.main)+'</span>';
}
function endingHtml(){
 var w=S.cur,sec=curSec(),total=S.items.filter(function(x){return counted(x)&&required(x)}).length,left=uncounted(w);
 var h='<p class="note">'+esc((total-left)+" of "+total+" counted. Count each item with the + and − buttons or type it, then tap Confirm ending count.")+'</p><ul class="list">';
 S.items.forEach(function(it,i){
  if(!counted(it)||grp(it)!==sec)return;
  var c=calc(w,it),k=keyOf(it),d=S.edrafts[k],val=d!==undefined?d:c.e;
  h+='<li class="row end"><div class="nmbox"><div class="nm">'+esc(it.item)+'</div><div class="tg">Begin '+fmt(c.b)+' + Added '+fmt(c.a)+' = '+fmt(r2(c.b+c.a))+(it.unit?' <span class="u">'+esc(it.unit)+'</span>':"")+(it.perBox?' · <span class="u">'+fmt(it.perBox)+' per box</span>':"")+(it.note?' · <span class="u">'+esc(it.note)+'</span>':"")+'</div></div>'+
   '<div class="step"><button type="button" class="stp" data-kind="e" data-step="'+(-stepOf(it))+'" data-key="'+esc(k)+'" aria-label="'+esc((stepOf(it)<1?"A quarter less ":"One less ")+it.item)+'">−</button>'+
   '<label class="cin'+(d!==undefined?" has":"")+'"><span class="sr">'+esc("Ending count: "+it.item)+'</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" data-ekey="'+esc(k)+'" value="'+(val===null||val===undefined?"":esc(fmt(val)))+'" placeholder="–"></label>'+
   '<button type="button" class="stp plus" data-kind="e" data-step="'+stepOf(it)+'" data-key="'+esc(k)+'" aria-label="'+esc((stepOf(it)<1?"A quarter more ":"One more ")+it.item)+'">+</button>'+(it.perBox?'<button type="button" class="stp box" data-kind="e" data-step="'+it.perBox+'" data-key="'+esc(k)+'" aria-label="'+esc("Add one box ("+fmt(it.perBox)+") of "+it.item)+'">+ box</button>':'')+'</div>'+
   '<div class="ob none" id="e'+i+'" aria-live="polite"></div></li>';
 });
 return h+'</ul>';
}

/* Low stock: staff alerts for the week */
var lowText="";
function lowBy(){try{return localStorage.getItem("kinhfolk-stock-by")||""}catch(e){return""}}
function lowMatches(q){
 var toks=q.toLowerCase().split(/\s+/).filter(Boolean);
 if(!toks.length)return[];
 var out=[];
 S.items.forEach(function(it){
  var hay=(it.item+" "+grp(it)+" "+(it.vendor||"")).toLowerCase(),ok=true;
  toks.forEach(function(t){if(hay.indexOf(t)<0)ok=false});
  if(ok)out.push({it:it,starts:it.item.toLowerCase().indexOf(toks[0])===0?0:1});
 });
 out.sort(function(a,b){return a.starts-b.starts||a.it.item.localeCompare(b.it.item)});
 return out.slice(0,8).map(function(x){return x.it});
}
function lowListHtml(q){
 var m=lowMatches(q),w=S.cur;
 if(!m.length)return q.trim()?'<li class="lownone" role="presentation">'+esc("No item matches. Check the spelling.")+'</li>':"";
 return m.map(function(it,i){var k=keyOf(it),al=alertFor(w,k);
  return'<li role="presentation"><button type="button" role="option" id="lo'+i+'" aria-selected="false" data-pick="'+esc(k)+'"><span>'+esc(it.item)+'</span><small>'+esc(grp(it)+(it.vendor?" \u00B7 "+it.vendor:"")+(al?" \u00B7 already flagged":""))+'</small></button></li>';
 }).join("");
}
function lowUnit(key){var it=key?itemByKey(key):null;return it&&it.unit?String(it.unit).replace(/^(\d+(?:\.\d+)?)\s+([A-Za-z])/,"$1$2"):""}
function lowCountLabel(){var u=lowUnit(S.lowSel);return"Current count"+(u?", in "+u:"")}
/* Expected use for the rest of the week: last week's use (or the recent average), shared over the open days left (Thu-Sun) */
function projNeed(key){
 var closed=S.weeks.filter(function(x){return x.status==="closed"}),take=S.basis==="month"?AVG:1,smp=[];
 for(var i=closed.length-1;i>=0&&smp.length<take;i--){var u=S.usage[closed[i].id]&&S.usage[closed[i].id][key];if(u)smp.push(Math.max(0,u[0]))}
 if(!smp.length)return null;
 var f=0;smp.forEach(function(v){f+=v});f=f/smp.length;
 var left={4:4,5:3,6:2,0:1}[new Date().getDay()]||4;
 return Math.ceil(f*left/4-1e-9);
}
function lowProjHtml(){
 if(!S.lowSel)return"";
 var n=projNeed(S.lowSel),u=lowUnit(S.lowSel);
 return n===null?"":esc("Projected need to finish the week: "+n+(u?" "+u:""));
}
function lowDate(iso){var d=new Date(iso);return isNaN(d)?["",""]:[d.toLocaleDateString([],{month:"short",day:"numeric"}),d.toLocaleTimeString([],{hour:"numeric",minute:"2-digit"})]}
function lowAddHtml(a,u){
 var it=itemByKey(a.key);
 return'<div class="lowadd"><label class="lbl" for="lowaddq">'+esc("Stock added"+(u?" ("+u+")":""))+'</label>'+
  '<div class="step"><button type="button" class="stp lstp" data-lstep="'+(-stepOf(it))+'" aria-label="'+esc((stepOf(it)<1?"A quarter less ":"One less ")+(it?it.item:""))+'">\u2212</button>'+
  '<label class="cin'+(S.lowAdd.qty?" has":"")+'"><span class="sr">'+esc("Stock added")+'</span><input id="lowaddq" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" placeholder="0" value="'+esc(S.lowAdd.qty)+'"></label>'+
  '<button type="button" class="stp lstp plus" data-lstep="'+stepOf(it)+'" aria-label="'+esc((stepOf(it)<1?"A quarter more ":"One more ")+(it?it.item:""))+'">+</button></div>'+
  '<div class="lowbtns3"><button type="button" class="big light" id="lowaddcancel">Cancel</button><button type="button" class="big light" data-resolve="'+esc(a.id)+'">Dismiss alert</button><button type="button" class="big green" id="lowaddok">Confirm add</button></div></div>';
}
function lowPicked(){
 var it=S.lowSel?itemByKey(S.lowSel):null;
 return it?'<span class="chip ok">'+esc("\u2713 "+it.item)+'</span>':"";
}
var lowCount="";
function lowFormHtml(){
 var h='<div class="lowform"><label class="lbl" for="lowq">'+esc("Item running low")+'</label>'+
  '<input id="lowq" class="lowin" type="text" role="combobox" aria-expanded="false" aria-controls="lowlist" aria-autocomplete="list" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search" placeholder="Type an item, such as oat" value="'+esc(lowText)+'">'+
  '<ul id="lowlist" class="lowlist" role="listbox" aria-label="Matching items" hidden></ul><div id="lowpicked" class="lowpicked">'+lowPicked()+'</div>'+
  '<label class="lbl" for="lowby">'+esc("Your name (optional)")+'</label><input id="lowby" class="lowin" type="text" autocomplete="off" maxlength="40" value="'+esc(lowBy())+'">'+
  '<label class="lbl" for="lowcount" id="lowcountl">'+esc(lowCountLabel())+'</label><input id="lowcount" class="lowin" type="text" inputmode="decimal" autocomplete="off" placeholder="'+esc("Example: 2")+'" value="'+esc(lowCount)+'">'+
  '<div id="lowproj" class="lowproj">'+lowProjHtml()+'</div>'+
  '<div class="lowbtns"><button type="button" class="big light" id="lowcancel">Cancel</button><button type="button" class="big green" id="lowsend"'+(S.lowSel?"":" disabled")+'>'+esc("Send alert")+'</button></div></div>';
 return h;
}
function renderLow(){
 var el=$("lowbox");if(!el)return;
 if(!editable()||!S.items.length){el.innerHTML="";return}
 var w=S.cur,act=activeAlerts(w),h='<section class="lowsec'+(act.length?" has":"")+'" aria-labelledby="lowh"><h2 class="h low" id="lowh"><span>'+esc("⚠ Low stock")+'</span><span>'+act.length+'</span></h2>'+(act.length?'':'<p class="lowempty">'+esc("✓ Nothing flagged low right now.")+'</p>');
 act.forEach(function(a){
  var it=itemByKey(a.key),u=lowUnit(a.key),pn=projNeed(a.key),parts=[];
  if(typeof a.count==="number")parts.push(a.count+" left");
  if(pn!==null)parts.push(pn+" needed");
  var meta=[];if(a.week&&a.week!==w.id)meta.push("From last week");
  var dt=lowDate(a.time);
  h+='<div class="orow low"><div class="l"><div class="on">'+esc(it?it.item:a.key)+'</div>'+(parts.length?'<div class="sub cnt">'+esc(parts.join(" - "))+'</div>':"")+(meta.length?'<div class="sub">'+esc(meta.join(" \u00B7 "))+'</div>':"")+(a.note?'<div class="sub">'+esc(a.note)+'</div>':"")+'</div><div class="tm"><span>'+esc(dt[0])+'</span><span>'+esc(dt[1])+'</span>'+(a.by?'<span class="by">Added by '+esc(a.by)+'</span>':"")+'</div><div class="r"><button type="button" class="big light sm" data-lowadd="'+esc(a.id)+'" aria-expanded="'+(S.lowAdd&&S.lowAdd.id===a.id)+'">Add stock</button></div>'+(S.lowAdd&&S.lowAdd.id===a.id?lowAddHtml(a,u):"")+'</div>';
 });
 h+='</section>';
 h+='<button type="button" id="lowopen" hidden tabindex="-1" aria-hidden="true">Report a low item</button>';
 if(S.lowOpen)h+='<div class="lowmodal" id="lowmodal"><div class="lowdlg" role="dialog" aria-modal="true" aria-labelledby="lowdt"><h2 id="lowdt" class="lowdt">'+esc("Report a low item")+'</h2>'+lowFormHtml()+'</div></div>';
 el.innerHTML=h;
 if(S.lowOpen&&lowText&&!S.lowSel){var l=$("lowlist");l.innerHTML=lowListHtml(lowText);l.hidden=!l.innerHTML}
}
function pickLow(key){
 var it=itemByKey(key);if(!it)return;
 S.lowSel=key;lowText=it.item;
 var q=$("lowq");if(q){q.value=it.item;q.setAttribute("aria-expanded","false")}
 var l=$("lowlist");if(l){l.hidden=true;l.innerHTML=""}
 var p=$("lowpicked");if(p)p.innerHTML=lowPicked();
 var cl=$("lowcountl");if(cl)cl.textContent=lowCountLabel();var pj=$("lowproj");if(pj)pj.innerHTML=lowProjHtml();
 var b=$("lowsend");if(b){b.disabled=false}
 if(b)b.focus();
}
/* Edit week: fix beginning, added and ending for any week */
function editHtml(){
 var w=wk(),sec=curSec(),h='<p class="note">'+esc("Fix a mistake in "+w.label+". Changes save right away and the report, COGS and next week\u2019s beginning update.")+'</p><ul class="list">';
 S.items.forEach(function(it){
  if(!counted(it)||grp(it)!==sec)return;

   ecell("begin",k,it,"Begin",typeof w.begin[k]==="number"?w.begin[k]:0)+ecell("added",k,it,"Added",a)+ecell("end",k,it,"End",c.e===null?"":c.e)+

function ecell(field,k,it,label,val){
 return'<div class="ecell"><span class="el">'+label+'</span><label class="cin"><span class="sr">'+esc(label+": "+it.item)+'</span><input type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" autocorrect="off" spellcheck="false" data-edit="'+field+'" data-key="'+esc(k)+'" value="'+(val===""?"":esc(fmt(val)))+'" placeholder="\u2013"></label></div>';

function eoInner(c){return c.used===null?'<span>Not counted</span>':'<span>Used</span><b>'+esc(fmt(c.used))+'</b><span>'+esc(money(c.total))+'</span>'}

/* Report */
function sectionTotals(w){
 var out=[];
 sections().forEach(function(s){
  var rs=rows(w).filter(function(r){return grp(r.it)===s});
  if(!rs.length)return;
  var t=0;rs.forEach(function(r){if(r.total!==null)t+=r.total});
  out.push({section:s,rows:rs,total:r2(t)});
 });
 return out;
}
function totalCogs(w){var t=0;rows(w).forEach(function(r){if(r.total!==null)t+=r.total});return r2(t)}
function reportHtml(){
 var w=wk(),u=uncounted(w),oc=orderCount(w);
 var h='<div class="stats"><div class="stat"><div class="sl">COGS'+(u?" so far":"")+'</div><div class="sv">'+esc(money(totalCogs(w)))+'</div></div>'+
  '<div class="stat'+(oc?" bad":" plain")+'"><div class="sl">Items to order</div><div class="sv">'+oc+'</div></div>'+
  '<div class="stat plain"><div class="sl">Not counted</div><div class="sv">'+u+'</div></div></div>';
 h+='<div class="actions"><button type="button" class="big light" id="copyreport">Copy report</button><button type="button" class="big light" data-x="sheets:report">Google Sheets</button>'+(editable()?'<button type="button" class="big green" id="closeweek">Close week</button>':"")+'</div>';
 if(u)h+='<p class="note">'+esc(u===1?"1 item has no ending count yet. Its cost is left out.":u+" items have no ending count yet. Their cost is left out.")+'</p>';
 sectionTotals(w).forEach(function(s){
  h+='<section><h2 class="h"><span>'+esc(s.section)+'</span><span>'+esc(money(s.total))+'</span></h2>';
  s.rows.forEach(function(r){
   var it=r.it;
   h+='<div class="orow'+(r.order&&!r.check?" ord":"")+'"><div class="l"><div class="on">'+esc(it.item)+'</div><div class="sub">Begin '+esc(fmt(r.b))+' + Added '+esc(fmt(r.a))+' \u2212 End '+esc(r.e===null?"\u2013":fmt(r.e))+'</div>'+
    (r.check?'<span class="chip warn">! Check count</span>':"")+'</div>'+
    '<div class="r">'+(r.used===null?'<div class="q">Not counted</div>':'<div class="q">'+esc(fmt(r.used))+(it.unit?' <span class="u">'+esc(it.unit)+'</span>':"")+' used</div><div class="c">'+esc(money(r.total))+'</div>')+'</div></div>';
  });
  h+='</section>';
 });
 h+='<section><h2 class="h">Added this week</h2>'+logHtml(w,false)+'</section>';
 return h;
}
function reportText(){
 var w=wk(),lines=["COGS report - "+w.label,"Total COGS: "+money(totalCogs(w))];
 sectionTotals(w).forEach(function(s){
  lines.push("","*"+s.section+"* "+money(s.total));
  s.rows.forEach(function(r){
   if(r.used===null){lines.push("- "+r.it.item+": not counted");return}
   lines.push("- "+r.it.item+": "+fmt(r.used)+(r.it.unit?" "+r.it.unit:"")+" used = "+money(r.total)+(r.order?"  (ORDER)":"")+(r.check?"  (CHECK COUNT)":""));
  });
 });
 return lines.join("\n");
}

/* Order list: by vendor, then by section */
function vendorGroups(w){

function monthName(m){var p=String(m).split("-");return new Date(+p[0],+p[1]-1,1).toLocaleString("en-US",{month:"long",year:"numeric"})}

  var m=monthOf(w);if(!m)return;
  if(!by[m]){by[m]={month:m,weeks:[],total:0,closed:0,open:false};ms.push(by[m])}
  by[m].weeks.push(w);
  if(w.status==="closed"){by[m].closed++;by[m].total+=(typeof w.total==="number"?w.total:0)}else by[m].open=true;
 });
 ms.sort(function(a,b){return a.month<b.month?1:-1});
 ms.forEach(function(g){g.total=r2(g.total)});

}
function monthSums(g){
 var items={};
 g.weeks.forEach(function(w){
  if(w.status!=="closed")return;
  var u=S.usage[w.id]||{};
  Object.keys(u).forEach(function(k){
   var x=items[k]||(items[k]={used:0,cost:0});
   x.used+=u[k][0];x.cost+=u[k][0]*u[k][1];
  });
 });
 var out=[];
 sections().forEach(function(sec){
  var rs=[],t=0;
  S.items.forEach(function(it){
   if(!counted(it)||grp(it)!==sec)return;
   var x=items[keyOf(it)];
   if(!x||(x.used===0&&x.cost===0))return;
   rs.push({it:it,used:r2(x.used),avg:r2(x.used/Math.max(1,g.closed)),cost:r2(x.cost)});t+=x.cost;
  });
  if(rs.length)out.push({section:sec,rows:rs,total:r2(t)});
 });

}

function status(){
 var n=S.queue.length,el=$("sync"),msg,warn=false;
 if(notice){el.textContent=notice.text;el.className=notice.warn?"warn":"";return}
 if(!HAS_API){msg="\u26A0 Not connected \u2013 changes are kept on this tablet only";warn=true}
 else if(!loaded)msg="Loading\u2026";

 else if(inflight||busy)msg="Saving\u2026";
 else if(netErr&&n){msg="\u26A0 Can\u2019t reach the saving service \u2013 "+plural(n)+" waiting, retrying";warn=true}
 else if(n)msg="Waiting to save\u2026 "+plural(n);
 else if(stale){msg="\u26A0 Couldn\u2019t load shared data \u2013 showing this tablet\u2019s copy";warn=true}
 else if(lastError){msg="\u26A0 A change was not accepted: "+lastError;warn=true}
 else msg="\u2713 All changes saved";

function post(body){
 var ctl=typeof AbortController==="function"?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},25000);
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()})
  .then(function(d){clearTimeout(to);return d},function(e){clearTimeout(to);throw e});
}
function bodyFor(op){

 if(op.type==="resolve")return{action:"resolveAlert",week:op.week,id:op.id};

 if(op.type==="begin")return{action:"setBeginning",week:op.week,key:op.key,count:op.count};

function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(function(){flushTimer=null;flush()},ms)}
function enqueue(op){

async function flush(){
 if(flushing)return;
 if(!HAS_API||!S.queue.length||!navigator.onLine){status();return}
 flushing=true;var failed=false,rejected=false;
 while(S.queue.length&&navigator.onLine){
  var op=S.queue[0];inflight=op;status();
  try{
   var d=await post(bodyFor(op));
   S.queue=S.queue.filter(function(o){return o.qid!==op.qid});
   if(op.type==="edit")edited[op.week]=true;
   if(op.type==="alert"&&d&&d.ok){
    if(d.duplicate)showNotice("This item is already flagged low",false,6000);
    else if(d.discord==="sent")showNotice("\u2713 Low stock alert sent to Discord",false,7000);
    else if(d.discord==="not_set")showNotice("\u26A0 Alert saved, but Discord isn\u2019t set up",true,9000);
    else if(d.discord)showNotice("\u26A0 Alert saved, but Discord didn\u2019t send it",true,9000);
   }
   if(d&&d.ok){netErr=false;lastError="";retryMs=0;stale=false}
   else{lastError=(d&&d.error)||"unknown error";rejected=true}
   persist();
  }catch(e){netErr=true;failed=true;break}
 }
 inflight=null;flushing=false;
 if(!failed&&!S.queue.length&&Object.keys(edited).length){Object.keys(edited).forEach(function(id){delete S.cache[id]});edited={};loadRemote()}

}

  if(!flushing&&S.queue.length)await flush();

 }

}

   var d=await fetchJson(API+(S.viewId&&!S.cache[S.viewId]?"?week="+encodeURIComponent(S.viewId):""));

   S.cur=d.current?rebase(d.current):null;
   if(S.cur&&S.edw!==S.cur.id){S.edrafts={};S.edw=S.cur.id}
   if(d.week)S.cache[d.week.id]=rebase(d.week);
