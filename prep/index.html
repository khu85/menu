:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto}
#sync{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 18px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:22px}
#sync.warn{background:#f2c230;color:var(--ink)}
main{padding:24px 28px 72px;max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:44px;line-height:1.1;margin-right:auto}
.big{min-height:68px;padding:0 30px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:30px;cursor:pointer}
#newcount.armed{background:#b3261e;color:#fff}
.big.icon{width:76px;padding:0;display:inline-grid;place-items:center}
.big.icon svg{width:44px;height:44px;display:block}
#discordbtn.armed{background:var(--brand)}
.big[disabled]{opacity:.6;cursor:wait}
#setupbtn[aria-pressed="true"]{background:var(--brand)}
section{margin-top:28px}
section h2{background:var(--ink);color:var(--beige);border-radius:2px;padding:10px 18px;font-size:28px;margin:0 0 14px;letter-spacing:1px}
.empty{font-size:28px;padding:24px;border:3px dashed var(--ink);border-radius:2px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:18px}

function unitFor(it,t){return it.u?(t===1?it.u.replace(/s$/,""):it.u):""}
var RECIPES_URL="../recipes/"; /* the recipes folder next to the prep folder */
/* How much one batch makes, in the same unit as the counts (bottles). A pair means [single batch, full batch]. */
var PER_BATCH={"Sea Salt Cream Top":1.5,"Calamansi Cream Top":1,"Pandan Coconut Cloud":2,"Coconut Cloud":1.5,"Mango Sticky Rice Cloud":1.5,"Pandan Coconut Milk":[1.5,4],"Coconut Milk":[1.5,4],"Mango Sticky Rice Milk":[1.5,4],"Earl Grey Syrup":1.3125};
function slugOf(it){return it.n.toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")}
function recipeUrl(it){
 if(it.g==="Coffee")return"";
 var url=RECIPES_URL,tg=tgt(it),c=count(it.n),pb=PER_BATCH[it.n];
 if(tg!==null&&c<tg&&pb){
  var need=tg-c,full=0,per=pb;
  if(Array.isArray(pb)){full=need>=pb[1]?1:0;per=pb[full]}
  url+="?b="+Math.max(1,Math.ceil(need/per-1e-9))+(full?"&v=1":"")+"&need="+need;
 }
 return url+"#"+slugOf(it);
}
function recipeLink(it,i){
 var u=recipeUrl(it);
 return u?'<a class="rl"'+(i===undefined?'':' id="rl'+i+'"')+' href="'+u+'" target="_blank" rel="noopener" aria-label="'+esc("Recipe for "+it.n+" (opens in a new tab)")+'">'+esc("Recipe")+'</a>':"";
}
function nameLink(it){return esc(it.n)}
function iconLink(it,i){
 var u=recipeUrl(it);
 return (u?'<a class="rl ri"'+(i===undefined?'':' id="rl'+i+'"')+' href="'+u+'" target="_blank" rel="noopener" aria-label="'+esc("Recipe for "+it.n+" (opens in a new tab)")+'" title="Recipe"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M4 20a2 2 0 0 0 2 1h13v-3M9 7h6"/></svg></a>':"");
}
function renderSummary(){
 var el=$("summary");
 if(setupOpen){el.innerHTML="";return}
 var more=[],low=[],none=[];
 ITEMS.forEach(function(it){
  if(!isOn(it))return;
  var tg=tgt(it),c=count(it.n);
  if(tg===null){none.push(it.n);return}
  if(c>=tg)return;
  (Math.round(c/tg*100)>=41?low:more).push({it:it,need:tg-c,pc:Math.round(c/tg*100)});
 });
 var h='<section class="sum" aria-labelledby="sumh"><h2 id="sumh">'+esc("To prep")+'</h2>';
 if(!more.length&&!low.length)h+='<p>'+esc("\u2713 Everything is at target")+'</p>';
 else{
  h+='<ul>';
  more.concat(low).sort(function(x,y){return x.pc-y.pc||x.it.n.localeCompare(y.it.n)}).forEach(function(r){
   var cl=r.pc>=71?"ok":(r.pc>=41?"low":"more");
   h+='<li class="'+cl+'"><span class="sn">'+nameLink(r.it)+'</span><span class="sd">'+esc("Need "+fq(r.need)+" more")+'</span>'+iconLink(r.it)+'</li>';
  });
  h+='</ul>';
 }
 if(none.length)h+='<p>'+esc("No target set: "+none.join(", "))+'</p>';
 el.innerHTML=h+'</section>';
}
function targetText(it){
 var t=tgt(it);
 if(t===null)return"Target not set";
 var u=unitFor(it,t);
 return"Target "+fq(t)+(u?" "+u:"");
}
function renderCount(){
 var html="",any=false;
 GROUPS.forEach(function(g){
  var rows="";

   if(it.g!==g||!isOn(it))return;

   rows+='<li class="row"><div class="nmbox none" id="nb'+i+'"><div class="nmt"><div class="nm">'+nameLink(it)+'</div><div class="tg"><span id="t'+i+'">'+esc(targetText(it))+'</span><span class="chip none" id="s'+i+'"></span></div></div>'+iconLink(it,i)+'</div>'+
    '<div class="ctl" role="group" aria-label="'+esc(it.n)+'">'+

    '<div class="ct" id="c'+i+'" aria-live="polite">0</div>'+

    '</li>';
  });

 });

function statusOf(c,t){
 if(t===null)return{cls:"none",ic:"\u2013",word:"No target"};
 var pc=t>0?Math.round(c/t*100):100,w=pc+"%";
 if(pc>=71)return{cls:"ok",ic:"",word:w};
 if(pc>=41)return{cls:"low",ic:"",word:w};
 return{cls:"bad",ic:"",word:w};
}
function paintRow(i){

 if(!s)return;
 var it=ITEMS[i],c=count(it.n),st=statusOf(c,tgt(it));
 $("c"+i).textContent=fq(c);

 s.innerHTML='<span aria-hidden="true">'+st.ic+'</span><span>'+esc(st.word)+'</span>';

   if(it.g!==g)return;
   var on=isOn(it),t=tgt(it);
   cells+='<div class="pc"><button type="button" data-sel="'+i+'" aria-pressed="'+on+'">'+esc(it.n)+'</button>'+

     '<button type="button" data-tstep="-0.25" data-i="'+i+'" aria-label="'+esc("Lower target for "+it.n+" by one quarter")+'">\u2212</button>'+
     '<input id="ti'+i+'" data-tin="'+i+'" type="number" inputmode="decimal" min="0.25" max="999" step="0.25" placeholder="\u2013" aria-label="'+esc("Target for "+it.n)+'" value="'+(t===null?"":t)+'">'+
     '<button type="button" data-tstep="0.25" data-i="'+i+'" aria-label="'+esc("Raise target for "+it.n+" by one quarter")+'">+</button></div>'
     :'<div class="tm ph" aria-hidden="true"></div>')+'</div>';
  });
  html+='<section><h2>'+esc(g)+'</h2><div class="pick">'+cells+'</div></section>';
 });

}
function setView(open){

  if(old!==undefined){delete S.cfg.t[it.n];persist();enqueueSettings()}

var notice=null,noticeTimer=null,inflight=null,flushing=false,flushTimer=null,retryMs=0,netErr=false,lastError="",loaded=false,stale=false,noSync=false;
function plural(n){return n===1?"1 change":n+" changes"}
function status(){
 var n=S.queue.length,el=$("sync"),msg,warn=false;
 if(notice){el.textContent=cap(notice.text);el.className=notice.warn?"warn":"";return}
 if(!loaded)msg="Loading counts\u2026";
 else if(!navigator.onLine){msg="\u26A0 Offline \u2013 "+(n?plural(n)+" waiting to send":"counts are kept on this tablet");warn=true}
 else if(inflight)msg="Saving\u2026";
 else if(netErr&&n){msg="\u26A0 Can\u2019t reach the saving service \u2013 "+plural(n)+" waiting, retrying";warn=true}
 else if(n)msg="Waiting to save\u2026 "+plural(n);
 else if(stale){msg="\u26A0 Couldn\u2019t load shared counts \u2013 showing this tablet\u2019s counts";warn=true}
 else if(lastError){msg="\u26A0 A change was not accepted: "+lastError;warn=true}
 else if(noSync){msg="\u26A0 Counts are saved, but the list and targets are not shared \u2013 update the Google script";warn=true}
 else msg="\u2713 All changes saved";
 el.textContent=cap(msg);
 el.className=warn?"warn":"";
}
function send(op){
 return post(op.type==="clear"?{action:"clear"}:op.type==="settings"?{action:"saveSettings",settings:op.cfg}:{action:"set",item:op.item,count:op.count});
}
function post(body){
 var ctl=typeof AbortController==="function"?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},15000);
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()})
  .then(function(d){clearTimeout(to);return d},function(e){clearTimeout(to);throw e});
}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(function(){flushTimer=null;flush()},ms)}
async function flush(){
 if(flushing)return;
 if(!S.queue.length||!navigator.onLine){status();return}
 flushing=true;
 var failed=false;
 while(S.queue.length&&navigator.onLine){
  var op=S.queue[0];
  inflight=op;status();
  try{
   var d=await send(op);
   S.queue=S.queue.filter(function(o){return o.id!==op.id});
   if(d&&d.ok){netErr=false;lastError="";retryMs=0;stale=false}
   else lastError=(d&&d.error)||"unknown error";
   persist();
  }catch(e){netErr=true;failed=true;break}
 }
 inflight=null;flushing=false;
 if(failed){retryMs=Math.min(60000,retryMs?retryMs*2:5000);scheduleFlush(retryMs)}

}
function enqueueSet(item,n){
 S.queue=S.queue.filter(function(o){return(inflight&&o.id===inflight.id)||o.type!=="set"||o.item!==item});
 S.queue.push({id:++S.seq,type:"set",item:item,count:n});
 persist();status();scheduleFlush(350);
}
function enqueueClear(){
 S.queue=S.queue.filter(function(o){return(inflight&&o.id===inflight.id)||o.type==="settings"});
 S.queue.push({id:++S.seq,type:"clear"});
 persist();status();scheduleFlush(0);

function buildReport(){
 var groups=[];
 GROUPS.forEach(function(g){
  var items=[];
  ITEMS.forEach(function(it){if(it.g===g&&isOn(it))items.push({item:it.n,count:count(it.n),target:tgt(it)})});
  if(items.length)groups.push({name:g,items:items});

async function sendDiscord(){

 try{
  var d=await post({action:"sendDiscord",report:report});
  if(d&&d.ok){

function enqueueSettings(){

async function loadRemote(){
 var cfgChanged=false;
 try{
  var r=await fetch(API,{cache:"no-store"});
  var d=await r.json();
  if(!d||!d.ok)throw new Error("bad response");
  var c={};
  ITEMS.forEach(function(it){c[it.n]=q(d.counts&&d.counts[it.n])});
  S.queue.forEach(function(op){
   if(op.type==="clear")ITEMS.forEach(function(it){c[it.n]=0});
   else if(op.type==="set")c[op.item]=op.count;
  });
  S.counts=c;stale=false;
  var pending=S.queue.some(function(o){return o.type==="settings"});
  if(d.settings===undefined){
   noSync=true;
   S.queue=S.queue.filter(function(o){return o.type!=="settings"});
  }else{
   noSync=false;
   if(d.settings===null){if(!pending)enqueueSettings()}
   else if(!pending&&!setupOpen){
    var before=JSON.stringify(S.cfg);
    S.cfg={on:d.settings.on||{},t:d.settings.t||{}};
    cfgChanged=before!==JSON.stringify(S.cfg);
   }
  }
  persist();
 }catch(e){stale=true}

 status();
}

function wireHold(root,sel,apply){

    if(apply(b)===false){stop();return}

  },450);
 });

}

/* red notification badges on the page links: low stock items, and events in the next 7 days that are not paid */
(function(){
 var STOCK_API="https://script.google.com/macros/s/AKfycbwD87ttdlNAqROnHrWgwhuJUxsB43yG55RJUuLiObC6Uet0E3jCI727FF25FP2odyFs/exec";
 function setBadge(pg,n,what){d.querySelectorAll('[data-pg="'+pg+'"]').forEach(function(a){
  var e=a.querySelector(".nbd");
  if(!n){if(e)e.remove();return}
  if(!e){e=d.createElement("i");e.className="nbd";a.appendChild(e)}
  e.textContent=n>99?"99+":String(n);e.setAttribute("aria-label",n+" "+what);e.title=n+" "+what})}
 function events(){
  if(site!=="owner")return;
  var list=[];try{list=JSON.parse(localStorage.getItem("kf-evlist"))||[]}catch(e){}
  var now=new Date(),pad=function(n){return(n<10?"0":"")+n},iso=function(t){return t.getFullYear()+"-"+pad(t.getMonth()+1)+"-"+pad(t.getDate())};
  var today=iso(now),lim=iso(new Date(now.getTime()+7*86400000));
  var n=list.filter(function(e){return e&&e.date&&e.date>=today&&e.date<=lim&&e.pay!=="paid"&&!/^s[1-4]$/.test(e.id||"")}).length;
  setBadge("events",n,n===1?"event needs attention":"events need attention")}
 function stock(n){setBadge("stock",n,n===1?"low stock item":"low stock items")}
 events();
 try{fetch(STOCK_API,{cache:"no-store"}).then(function(r){return r.json()}).then(function(j){
  var low=((j&&j.current&&j.current.alerts)||[]).filter(function(a){return a.status==="active"}).length;stock(low)}).catch(function(){})}catch(e){}
 var lb=d.getElementById("lowbox");
 if(lb&&window.MutationObserver)new MutationObserver(function(){stock(d.querySelectorAll("#lowbox .orow.low").length)}).observe(lb,{childList:true,subtree:true});
 window.addEventListener("storage",events);
})();
})();
