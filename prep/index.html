:root{--ink:#333132;--beige:#f1eedb;--brand:#005949;color-scheme:light;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--beige);color:var(--ink);font-family:"Neulis Sans","Avenir Next","Nunito Sans","Segoe UI",system-ui,sans-serif;font-weight:600;font-size:24px;line-height:1.35;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--brand)}
button{font:inherit;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--brand);color:var(--beige);display:flex;align-items:center;gap:16px;padding:12px 24px;flex-wrap:wrap}
header .logo{height:68px;width:auto;display:block}
header .wm{font-size:32px;letter-spacing:1px;margin-right:auto}
#sync{display:flex;align-items:center;gap:10px;min-height:56px;padding:6px 18px;border-radius:2px;background:var(--beige);color:var(--ink);font-size:22px}
#sync.warn{background:#f2c230;color:var(--ink)}
main{padding:24px 28px 72px;max-width:1000px;margin:0 auto}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}
.top h1{margin:0;font-size:44px;line-height:1.1;margin-right:auto}
.big{min-height:68px;padding:0 30px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:30px;cursor:pointer}
#newcount.armed{background:#b3261e;color:#fff}
#setupbtn[aria-pressed="true"]{background:var(--brand)}
section{margin-top:28px}
section h2{font-size:32px;margin:0 0 14px;padding-bottom:6px;border-bottom:4px solid var(--ink);letter-spacing:1px}
.empty{font-size:28px;padding:24px;border:3px dashed var(--ink);border-radius:2px}
ul.list{list-style:none;margin:0;padding:0;display:grid;gap:18px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px 12px;align-items:stretch}
.nmbox{background:var(--ink);color:var(--beige);border-radius:2px;padding:8px 16px;min-height:72px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.nm{font-size:30px;line-height:1.15}
.tg{font-size:22px;line-height:1.25}
.ctl{display:flex;align-items:stretch;gap:10px}
.ctl button{width:84px;min-height:76px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:52px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.ctl button:active{background:var(--brand)}
.ct{min-width:100px;display:grid;place-items:center;border:3px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink);font-size:52px;line-height:1}
.st{grid-column:1/-1;display:flex;align-items:center;justify-content:center;gap:12px;min-height:52px;padding:4px 18px;border-radius:2px;font-size:28px}
.st.ok{background:#1b6e3c;color:#fff}
.st.low{background:#f2c230;color:var(--ink)}
.st.bad{background:#b3261e;color:#fff}
.st.none{border:3px dashed var(--ink);color:var(--ink)}
.st .ic{font-size:34px;line-height:1}
.intro{font-size:26px;margin:0 0 4px}
.pick{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:132px;gap:12px}
.pick button{height:100%;padding:8px 10px;border:3px solid var(--ink);border-radius:2px;background:var(--ink);color:var(--beige);font-size:22px;line-height:1.15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer;text-align:center}
.pick button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--beige)}
.pick .ps{font-size:18px}
.sub{font-size:22px;letter-spacing:1px;margin:18px 0 4px}
.tgrow{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 0;border-bottom:2px solid var(--ink)}
.tgrow label{font-size:28px;flex:1 1 260px}
.tc{display:flex;align-items:center;gap:10px}
.tc button{width:72px;height:72px;border:0;border-radius:2px;background:var(--ink);color:var(--beige);font-size:44px;line-height:1;cursor:pointer;display:grid;place-items:center;padding:0}
.tc input{width:120px;height:72px;font:inherit;font-size:36px;text-align:center;border:3px solid var(--ink);border-radius:2px;background:#fff;color:var(--ink)}
.tc .un{min-width:120px;font-size:24px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
button:focus-visible,input:focus-visible{outline:4px solid var(--brand);outline-offset:3px}
header button:focus-visible{outline-color:var(--beige)}
@media (max-width:900px){.pick{grid-template-columns:repeat(2,1fr)}}
@media (max-width:620px){header{padding:10px 14px}header .wm{display:none}.row{grid-template-columns:1fr}.ctl{justify-content:space-between}.ctl button{flex:1}.top h1{font-size:34px}}
</style>
</head>

<script>
(function(){
/* ---- Settings ---- */
var API="https://script.google.com/macros/s/AKfycbyKx4I_lpEZcIfX0zFrp7OQPWjc7MVRj6XirZ5m9GfRj-Y0XcqU9v1kZVFKj2XLzoNq/exec";
var KEY="kinhfolk-prepcheck-v1";
var GROUPS=["Cream Tops","Milk Bases","Syrups","Coffee"];
function I(n,g,u){return{n:n,g:g,u:u||""}}
var ITEMS=[
 I("Sea Salt Cream Top","Cream Tops"),
 I("Calamansi Cream Top","Cream Tops"),
 I("Pandan Coconut Cloud","Cream Tops"),
 I("Coconut Cloud","Cream Tops"),
 I("Mango Sticky Rice Cloud","Cream Tops"),
 I("Pandan Coconut Milk","Milk Bases"),
 I("Coconut Milk","Milk Bases"),
 I("Mango Sticky Rice Milk","Milk Bases"),
 I("Simple Syrup","Syrups"),
 I("Pandan Syrup","Syrups"),
 I("Pho Spice Syrup","Syrups"),
 I("Earl Grey Syrup","Syrups"),
 I("Bergamot Earl Grey Syrup","Syrups"),
 I("Lychee Syrup","Syrups"),
 I("Mango Puree","Syrups"),
 I("Calamansi Syrup","Syrups"),
 I("Phin Brewed","Coffee"),
 I("Cold Brew","Coffee"),
 I("Drip","Coffee")
];
/* What is in the prep list the first time the page opens on a tablet. */
var DEFAULT_ON=["Sea Salt Cream Top","Pandan Coconut Cloud","Pandan Coconut Milk","Earl Grey Syrup","Pho Spice Syrup","Pandan Syrup"];
var DEFAULT_TARGETS={"Sea Salt Cream Top":8};

/* ---- Text helpers: all caps except measurements ---- */
var MR=/(\d+(?:[.\/]\d+)?(?:\u00B0F| ?(?:g|oz|cups?|containers?|bottles?)\b))/g;
function cap(t){return String(t).split(MR).map(function(s,i){return i%2?s:s.toLocaleUpperCase()}).join("")}
function esc(t){return cap(t).replace(/&/g,"&amp;").replace(/</g,"&lt;")}

/* ---- Saved state: counts, changes waiting to send, and the list setup ---- */
var S={counts:{},queue:[],seq:0,cfg:null};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&typeof p==="object"){S.counts=p.counts||{};S.queue=Array.isArray(p.queue)?p.queue:[];S.seq=+p.seq||0;S.cfg=p.cfg||null}}}catch(e){}
if(!S.cfg||!S.cfg.on||!S.cfg.t){
 S.cfg={on:{},t:{}};
 DEFAULT_ON.forEach(function(n){S.cfg.on[n]=true});
 for(var k in DEFAULT_TARGETS)S.cfg.t[k]=DEFAULT_TARGETS[k];
}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function count(n){return Math.max(0,Math.floor(Number(S.counts[n])||0))}
function isOn(it){return!!S.cfg.on[it.n]}
function tgt(it){var v=Number(S.cfg.t[it.n]);return v>=1?Math.floor(v):null}

/* ---- Elements ---- */
var $=function(id){return document.getElementById(id)};
$("wm").textContent=cap("Kinhfolk Prep Check");
var btn=$("newcount"),setupBtn=$("setupbtn"),setupOpen=false;

/* ---- Count view ---- */
function unitFor(it,t){return it.u?(t===1?it.u.replace(/s$/,""):it.u):""}
function targetText(it){
 var t=tgt(it);
 if(t===null)return"Target not set";
 var u=unitFor(it,t);
 return"Target "+t+(u?" "+u:"");
}
function renderCount(){
 var html="",any=false;
 GROUPS.forEach(function(g){
  var rows="";
  ITEMS.forEach(function(it,i){
   if(it.g!==g||!isOn(it))return;
   any=true;
   rows+='<li class="row"><div class="nmbox"><div class="nm">'+esc(it.n)+'</div><div class="tg" id="t'+i+'">'+esc(targetText(it))+'</div></div>'+
    '<div class="ctl" role="group" aria-label="'+esc(it.n)+'"><button type="button" data-act="-1" data-i="'+i+'" aria-label="'+esc("Decrease "+it.n)+'">\u2212</button>'+
    '<div class="ct" id="c'+i+'" aria-live="polite">0</div>'+
    '<button type="button" data-act="1" data-i="'+i+'" aria-label="'+esc("Increase "+it.n)+'">+</button></div>'+
    '<div class="st none" id="s'+i+'"></div></li>';
  });
  if(rows)html+='<section><h2>'+esc(g)+'</h2><ul class="list">'+rows+'</ul></section>';
 });
 if(!any)html='<p class="empty">'+esc("No prep items are selected. Tap Set up list to choose them.")+'</p>';
 $("groups").innerHTML=html;
 paintAll();
}
function statusOf(c,t){
 if(t===null)return{cls:"none",ic:"\u2013",word:"No target"};
 if(c>=t)return{cls:"ok",ic:"\u2713",word:"Ready"};
 if(c*2>=t)return{cls:"low",ic:"!",word:"Running low"};
 return{cls:"bad",ic:"\u2715",word:"Make more"};
}
function paintRow(i){
 var s=$("s"+i);
 if(!s)return;
 var it=ITEMS[i],c=count(it.n),st=statusOf(c,tgt(it));
 $("c"+i).textContent=c;
 s.className="st "+st.cls;
 s.innerHTML='<span class="ic" aria-hidden="true">'+st.ic+'</span><span>'+esc(st.word)+'</span>';
}
function paintAll(){ITEMS.forEach(function(_,i){paintRow(i)})}

/* ---- Set up view: choose items and set targets ---- */
function renderSetup(){
 var html='<p class="intro">'+esc("Tap the items you need to prep. Then set a target for each one.")+'</p>';
 GROUPS.forEach(function(g){
  var pick="",tg="";
  ITEMS.forEach(function(it,i){
   if(it.g!==g)return;
   var on=isOn(it);
   pick+='<button type="button" data-sel="'+i+'" aria-pressed="'+on+'"><span class="pn">'+esc(it.n)+'</span><span class="ps">'+esc(on?"In list":"Not in list")+'</span></button>';
   if(on){
    var t=tgt(it),u=unitFor(it,t||0)||it.u;
    tg+='<div class="tgrow"><label for="ti'+i+'">'+esc(it.n)+'</label><div class="tc">'+
     '<button type="button" data-tstep="-1" data-i="'+i+'" aria-label="'+esc("Lower target for "+it.n)+'">\u2212</button>'+
     '<input id="ti'+i+'" data-tin="'+i+'" type="number" inputmode="numeric" min="1" max="999" placeholder="\u2013" value="'+(t===null?"":t)+'">'+
     '<button type="button" data-tstep="1" data-i="'+i+'" aria-label="'+esc("Raise target for "+it.n)+'">+</button>'+
     '<span class="un">'+esc(u)+'</span></div></div>';
   }
  });
  html+='<section><h2>'+esc(g)+'</h2><div class="pick">'+pick+'</div>'+(tg?'<div class="sub">'+esc("Targets")+'</div>'+tg:'')+'</section>';
 });
 $("setup").innerHTML=html;
}
function setView(open){
 setupOpen=open;
 $("groups").hidden=open;$("setup").hidden=!open;btn.hidden=open;
 setupBtn.setAttribute("aria-pressed",open);
 setupBtn.textContent=cap(open?"Done":"Set up list");
 $("h1").textContent=cap(open?"Set up list":"Prep Check");
 if(open)renderSetup();else renderCount();
 window.scrollTo(0,0);
 $("announce").textContent=cap(open?"Set up list":"Prep Check");
}
setupBtn.addEventListener("click",function(){setView(!setupOpen)});
$("setup").addEventListener("click",function(e){
 var b=e.target.closest("button");
 if(!b)return;
 if(b.dataset.sel!==undefined){
  var it=ITEMS[+b.dataset.sel];
  if(isOn(it))delete S.cfg.on[it.n];else S.cfg.on[it.n]=true;
  persist();enqueueSettings();renderSetup();
  var again=document.querySelector('#setup [data-sel="'+b.dataset.sel+'"]');
  if(again)again.focus();
 }else if(b.dataset.tstep!==undefined){
  var i=+b.dataset.i,cur=tgt(ITEMS[i]),d=+b.dataset.tstep;
  if(cur===null&&d<0)return;
  var nt=Math.min(999,Math.max(1,(cur||0)+d));
  S.cfg.t[ITEMS[i].n]=nt;persist();enqueueSettings();
  var inp=$("ti"+i);if(inp)inp.value=nt;
 }
});
$("setup").addEventListener("change",function(e){
 var inp=e.target.closest("input[data-tin]");
 if(!inp)return;
 var it=ITEMS[+inp.dataset.tin],v=parseInt(inp.value,10);
 if(isNaN(v)||v<1){delete S.cfg.t[it.n];inp.value=""}
 else{v=Math.min(999,v);S.cfg.t[it.n]=v;inp.value=v}
 persist();enqueueSettings();
});

/* ---- Syncing with the Google Apps Script web app ---- */
var inflight=null,flushing=false,flushTimer=null,retryMs=0,netErr=false,lastError="",loaded=false,stale=false,noSync=false;
function plural(n){return n===1?"1 change":n+" changes"}
function status(){
 var n=S.queue.length,el=$("sync"),msg,warn=false;
 if(!loaded)msg="Loading counts\u2026";
 else if(!navigator.onLine){msg="\u26A0 Offline \u2013 "+(n?plural(n)+" waiting to send":"counts are kept on this tablet");warn=true}
 else if(inflight)msg="Saving\u2026";
 else if(netErr&&n){msg="\u26A0 Can\u2019t reach the saving service \u2013 "+plural(n)+" waiting, retrying";warn=true}
 else if(n)msg="Waiting to save\u2026 "+plural(n);
 else if(stale){msg="\u26A0 Couldn\u2019t load shared counts \u2013 showing this tablet\u2019s counts";warn=true}
 else if(lastError){msg="\u26A0 A change was not accepted: "+lastError;warn=true}
 else msg="\u2713 All changes saved";
 el.textContent=cap(msg);
 el.className=warn?"warn":"";
}
function send(op){
 var body=op.type==="clear"?{action:"clear"}:op.type==="settings"?{action:"saveSettings",settings:op.cfg}:{action:"set",item:op.item,count:op.count};
 var ctl=typeof AbortController==="function"?new AbortController():null;
 var to=setTimeout(function(){if(ctl)ctl.abort()},15000);
 return fetch(API,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(body),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json()})
  .then(function(d){clearTimeout(to);return d},function(e){clearTimeout(to);throw e});
}
function scheduleFlush(ms){clearTimeout(flushTimer);flushTimer=setTimeout(function(){flushTimer=null;flush()},ms)}
async function flush(){
 if(flushing)return;
 if(!S.queue.length||!navigator.onLine){status();return}
 flushing=true;
 var failed=false;
 while(S.queue.length&&navigator.onLine){
  var op=S.queue[0];
  inflight=op;status();
  try{
   var d=await send(op);
   S.queue=S.queue.filter(function(o){return o.id!==op.id});
   if(d&&d.ok){netErr=false;lastError="";retryMs=0;stale=false}
   else lastError=(d&&d.error)||"unknown error";
   persist();
  }catch(e){netErr=true;failed=true;break}
 }
 inflight=null;flushing=false;
 if(failed){retryMs=Math.min(60000,retryMs?retryMs*2:5000);scheduleFlush(retryMs)}
 status();
}
function enqueueSet(item,n){
 S.queue=S.queue.filter(function(o){return(inflight&&o.id===inflight.id)||o.type!=="set"||o.item!==item});
 S.queue.push({id:++S.seq,type:"set",item:item,count:n});
 persist();status();scheduleFlush(350);
}
function enqueueClear(){
 S.queue=S.queue.filter(function(o){return(inflight&&o.id===inflight.id)||o.type==="settings"});
 S.queue.push({id:++S.seq,type:"clear"});
 persist();status();scheduleFlush(0);
}
function enqueueSettings(){
 if(noSync)return;
 S.queue=S.queue.filter(function(o){return(inflight&&o.id===inflight.id)||o.type!=="settings"});
 S.queue.push({id:++S.seq,type:"settings",cfg:JSON.parse(JSON.stringify(S.cfg))});
 persist();status();scheduleFlush(600);
}
async function loadRemote(){
 var cfgChanged=false;
 try{
  var r=await fetch(API,{cache:"no-store"});
  var d=await r.json();
  if(!d||!d.ok)throw new Error("bad response");
  var c={};
  ITEMS.forEach(function(it){c[it.n]=Math.max(0,Math.floor(Number(d.counts&&d.counts[it.n])||0))});
  S.queue.forEach(function(op){
   if(op.type==="clear")ITEMS.forEach(function(it){c[it.n]=0});
   else if(op.type==="set")c[op.item]=op.count;
  });
  S.counts=c;stale=false;
  var pending=S.queue.some(function(o){return o.type==="settings"});
  if(d.settings===undefined){
   noSync=true;
   S.queue=S.queue.filter(function(o){return o.type!=="settings"});
  }else{
   noSync=false;
   if(d.settings===null){if(!pending)enqueueSettings()}
   else if(!pending&&!setupOpen){
    var before=JSON.stringify(S.cfg);
    S.cfg={on:d.settings.on||{},t:d.settings.t||{}};
    cfgChanged=before!==JSON.stringify(S.cfg);
   }
  }
  persist();
 }catch(e){stale=true}
 loaded=true;
 if(cfgChanged&&!setupOpen)renderCount();else paintAll();
 status();
}

/* ---- Taps in the count view ---- */
$("groups").addEventListener("click",function(e){
 var b=e.target.closest("button[data-act]");
 if(!b)return;
 var i=+b.dataset.i,it=ITEMS[i],c=count(it.n),n=Math.min(999,Math.max(0,c+(+b.dataset.act)));
 if(n===c)return;
 S.counts[it.n]=n;
 paintRow(i);
 enqueueSet(it.n,n);
});

/* Start new count: first tap arms it, second tap clears everything. */
var armed=false,armTimer=null;
function setBtn(){
 btn.className="big"+(armed?" armed":"");
 btn.id="newcount";
 btn.textContent=cap(armed?"Tap again to clear all counts":"Start new count");
}
btn.addEventListener("click",function(){
 if(!armed){
  armed=true;setBtn();
  clearTimeout(armTimer);armTimer=setTimeout(function(){armed=false;setBtn()},5000);
  return;
 }
 clearTimeout(armTimer);armed=false;setBtn();
 ITEMS.forEach(function(it){S.counts[it.n]=0});
 paintAll();enqueueClear();
 $("announce").textContent=cap("All counts cleared");
});
setBtn();

/* ---- Connection and visibility ---- */
window.addEventListener("online",function(){
 status();scheduleFlush(0);
 if(stale&&!S.queue.length)loadRemote();
});
window.addEventListener("offline",status);
document.addEventListener("visibilitychange",function(){
 if(document.visibilityState==="visible"&&loaded&&!setupOpen&&!S.queue.length&&!flushTimer&&!flushing&&navigator.onLine)loadRemote();
});

setInterval(function(){
 if(document.visibilityState==="visible"&&loaded&&!setupOpen&&!S.queue.length&&!flushTimer&&!flushing&&navigator.onLine)loadRemote();
},60000);
setView(false);status();
loadRemote().then(function(){if(S.queue.length)scheduleFlush(0)});
})();
</script>
</body>
</html>
